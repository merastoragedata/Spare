<script>
/* =====================  YOUR WEB APP URL  ===================== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxfa7gvlLsjuVFCm-8vSXsITp8vfIZQgRRxIc_QnWMuri2mb3yC9pWuKHRwTD3awcBq/exec';
/* ============================================================== */

const USE_GS = (typeof google !== 'undefined' && google.script && google.script.run);
let TOKEN = localStorage.getItem('karjat_token') || '';
let ME = JSON.parse(localStorage.getItem('karjat_me') || 'null') || {username:'',fullName:'',role:'viewer'};
function api(fn,args){
  args=args||[];
  if(USE_GS) return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e.message||e))).__api__(fn,args,TOKEN));
  return fetch(WEB_APP_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({fn:fn,args:args,token:TOKEN})}).then(r=>r.json()).then(j=>{
      if(!j.ok){
        // A stale Apps Script deployment still serves the OLD Code.gs, whose API
        // map has no login/register/kit functions. Report that plainly.
        if(/Unknown API function/i.test(j.error||'')){ STALE_BACKEND=true; showStale(j.error); throw new Error('STALE_DEPLOYMENT'); }
        if(/log in again/i.test(j.error||'')) { doLogout(true); }
        throw new Error(j.error||'Server error');
      }
      return j.data;
    });
}
let STALE_BACKEND=false;
const FRONTEND_VERSION='3.0.0';
function showStale(err){
  const html='<div style="text-align:left;font-size:12.5px;line-height:1.6">'
   +'<div style="font-weight:800;color:var(--bad);margin-bottom:6px">Apps Script is running an OLD version of Code.gs</div>'
   +'<div style="color:var(--muted);margin-bottom:8px">Server said: <span class="mono">'+esc(err||'')+'</span></div>'
   +'<b>Fix it in 30 seconds:</b><ol style="margin:6px 0 8px 16px;padding:0">'
   +'<li>Apps Script editor &rarr; <b>Deploy</b> &rarr; <b>Manage deployments</b></li>'
   +'<li>Click the <b>&#9998; pencil</b> on your active deployment</li>'
   +'<li>Version &rarr; choose <b>New version</b> &rarr; <b>Deploy</b></li>'
   +'</ol>'
   +'<div style="color:var(--muted)">Saving Code.gs does <b>not</b> update the live web app — you must publish a new version every time.</div>'
   +'<div style="color:var(--muted);margin-top:6px">Also make sure the project has only <b>one</b> script file. A leftover old <span class="mono">.gs</span> file overrides the new one.</div>'
   +'<div style="margin-top:8px">Check anytime by opening your <span class="mono">/exec</span> URL in a browser — it should report <span class="mono">"version":"'+FRONTEND_VERSION+'"</span>.</div>'
   +'</div>';
  const el=document.getElementById('loginMsg');
  if(el && document.getElementById('loginwrap').style.display!=='none'){ el.innerHTML=html; el.className='loginmsg show bad'; }
  else { modal('Deployment out of date', html, '<button class="btn primary" onclick="closeModal()">OK</button>'); }
}
let DB={settings:{},uoms:[],ownerships:[],kitStatuses:[],moveReasons:[],categories:[],items:[],docs:[],kits:[],reports:[],serverDate:'',folderUrl:''};
const S={page:'home',itemId:null,kitId:null,tab:'summary',doctab:'all',kittab:'summary',issuedTab:'utilised',reportsTab:'receipt',kitRemTab:'ops',q:'',docq:'',lowSettings:false,kitOwn:'all',reorderItems:false,reorderKits:false,cat:null,regCat:null,kitRegCat:null,hist:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jq=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
// user-defined order first (sortOrder>0), then anything unordered by name
const byOrder=(a,b)=>{ const ao=Number(a.sortOrder||0),bo=Number(b.sortOrder||0);
  if(ao&&bo) return ao-bo; if(ao&&!bo) return -1; if(!ao&&bo) return 1; return String(a.name||'').localeCompare(String(b.name||'')); };
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const fmtDate=d=>{ if(!d) return '—'; const p=String(d).split('-'); return p.length===3? p[2]+'.'+p[1]+'.'+p[0] : d; };
const fmtN=n=>{ n=Number(n||0); return (n%1===0? n : Number(n.toFixed(2))).toLocaleString('en-IN'); };
const money=n=>{ n=Number(n||0); return n? '₹ '+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'; };
const money0=n=>'₹ '+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const cat=id=>DB.categories.find(c=>c.id===id)||{name:'—',fields:[]};
const item=id=>DB.items.find(i=>i.id===id);
const doc_=id=>DB.docs.find(d=>d.id===id);
const recvQty=i=>(i.receipts||[]).reduce((s,r)=>s+Number(r.qty||0),0);
const issQty=i=>(i.issues||[]).reduce((s,r)=>s+Number(r.qty||0),0);
const availQty=i=>recvQty(i)-issQty(i);
const recvVal=i=>(i.receipts||[]).reduce((s,r)=>s+Number(r.totalAmt||0),0);
// Best per-unit value: manual unitValue if set, else derived from receipt bills (total value ÷ total qty)
const unitValOf=i=>{ if(Number(i.unitValue)>0) return Number(i.unitValue);
  const q=recvQty(i), v=recvVal(i); return q>0?v/q:0; };
// Value of what is actually in stock right now
const availVal=i=>Math.max(0,availQty(i))*unitValOf(i);
const isAdmin=()=>ME.role==='admin';
const isViewer=()=>ME.role==='viewer';
const canEdit=()=>ME.role==='admin'||ME.role==='editor';
const isLow=i=>!!i.trackLow && availQty(i)<=Number(i.lowCutoff||0);
const lowItems=()=>DB.items.filter(isLow);
function lastAct(i){ const d=[...(i.receipts||[]).map(r=>r.date),...(i.issues||[]).map(r=>r.date)].filter(Boolean).sort(); return d.length?d[d.length-1]:String(i.createdAt||'').slice(0,10); }
function stockTag(i){ const a=availQty(i);
  if(isLow(i)) return '<span class="tag bad">Low — '+fmtN(a)+' ≤ '+fmtN(i.lowCutoff)+'</span>';

const NOTIF_KEY='karjat_notifs';

function saveNotifs(list){ try{ sessionStorage.setItem(NOTIF_KEY, JSON.stringify(list.slice(0,5))); }catch(e){} }
function pushNotif(msg,kind,title){
  const list=loadNotifs();
  list.unshift({id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),msg,kind:kind||'',title:title||'',t:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})});

function renderBell(){
  const list=loadNotifs();
  const cnt=$('#bellCount');
  if(list.length){ cnt.style.display='inline-block'; cnt.textContent=list.length; } else cnt.style.display='none';
  $('#bellList').innerHTML = list.length? list.map(n=>{
    const ic={ok:'✓',bad:'✕',warn:'⚠'}[n.kind]||'i';
    return '<div class="bp-item"><div class="tt"><span style="color:'+(n.kind==='ok'?'var(--ok)':n.kind==='bad'?'var(--bad)':n.kind==='warn'?'var(--warn)':'var(--blue)')+'">'+ic+'</span> '+esc(n.title||'Update')+'<span class="spacer"></span><button class="ack" title="Acknowledge" onclick="ackNotif(\''+n.id+'\')">✕</button></div>'

  }).join('') : '<div class="bp-empty">No notifications yet this session.</div>';

window.ackNotif=id=>{ saveNotifs(loadNotifs().filter(n=>n.id!==id)); renderBell(); };

function toast(msg,kind,title){
  pushNotif(msg,kind,title);
  const ic={ok:'✓',bad:'✕',warn:'⚠'}[kind]||'i';
  const d=document.createElement('div'); d.className='toast '+(kind||'');
  d.innerHTML='<div class="ic">'+ic+'</div><div class="tx">'+(title?'<div class="tt">'+esc(title)+'</div>':'')+esc(msg)+'</div><button class="cl">×</button>';
  d.querySelector('.cl').onclick=()=>collapseToast(d);
  const toasts=$('#toasts');
  toasts.appendChild(d);
  // Keep at most 5 live toasts. Work on a snapshot of not-yet-collapsing nodes:
  // collapseToast() removes the node only after its 320ms animation, so testing
  // toasts.children directly in a loop would never terminate.
  const live=[...toasts.children].filter(x=>!x.dataset.collapsing);
  while(live.length>5) collapseToast(live.shift());
  setTimeout(()=>collapseToast(d), kind==='bad'?6000:3600);
}
function collapseToast(d){
  if(!d||!d.parentNode||d.dataset.collapsing) return;
  d.dataset.collapsing='1';
  d.style.transition='opacity .3s,transform .3s,max-height .3s,margin .3s,padding .3s';
  d.style.opacity='0'; d.style.transform='translateX(16px)';
  requestAnimationFrame(()=>{ d.style.maxHeight='0px'; d.style.marginTop='0'; d.style.paddingTop='0'; d.style.paddingBottom='0'; });
  setTimeout(()=>d.remove(),320);
}
function busy(on,msg,blocking){
  if(blocking){ // only the very first connect blocks
    $('#loader').classList.toggle('hide',!on); if(msg)$('#loadMsg').textContent=msg; return;
  }
  const bar=$('#topProgress'), chip=$('#workChip');
  if(on){
    if(msg){ $('#workMsg').textContent=msg; }
    bar.classList.add('on'); bar.style.width='75%';
    chip.classList.add('on');
  } else {
    bar.style.width='100%';
    setTimeout(()=>{ bar.classList.remove('on'); bar.style.width='0'; },300);
    chip.classList.remove('on');
  }
}

function printPages(htmlParts){
  const box=document.createElement('div'); box.id='printExportBox';
  box.innerHTML=(Array.isArray(htmlParts)?htmlParts.join(''):htmlParts);
  box.querySelectorAll('.crumb,.tabs,.subtabs,.no-print').forEach(el=>el.remove());
  // kill any leading page-break that would emit a blank first page
  const first=box.firstElementChild; if(first){ first.style.pageBreakBefore='auto'; first.style.breakBefore='auto'; first.style.marginTop='0'; }
  box.querySelectorAll(':scope > *').forEach((el,idx)=>{ if(idx===0){ el.style.marginTop='0'; } });
  document.body.appendChild(box);
  const hidden=[...document.querySelectorAll('.content > *:not(#printExportBox)')];
  hidden.forEach(el=>el.classList.add('no-print'));
  if(window.closeModal) closeModal();
  setTimeout(()=>{ window.print(); setTimeout(()=>{ box.remove(); hidden.forEach(el=>el.classList.remove('no-print')); render(); },350); },200);
}
function pageLatchHtml(scope){
  if(scope==='available') return pageAvailable()+availSummaryBlocks();
  if(scope==='issued')    return pageIssued();

const LB={s:1,x:0,y:0,drag:false,sx:0,sy:0,d:null};
const lbApply=()=>{ $('#lbImg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')'; $('#lbZ').textContent=Math.round(LB.s*100)+'%'; };
window.openDoc=async(id)=>{
  const d=doc_(id); if(!d){toast('Document not found','bad');return}
  $('#lb').classList.add('open'); document.body.style.overflow='hidden';
  $('#lbTitle').textContent=d.title||''; $('#lbImg').src=d.thumb||''; $('#lbLoad').style.display='block'; $('#lbLoad').textContent='Loading full image…';
  $('#lbDrive').href=d.url;
  LB.s=1;LB.x=0;LB.y=0;lbApply();
  try{ const full=await api('getDocFull',[id]);
    $('#lbImg').src=full; $('#lbLoad').style.display='none';
    $('#lbDl').href=full; $('#lbDl').setAttribute('download',(d.title||'document').toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,60)+'.jpg');
  }catch(e){ $('#lbLoad').textContent='Could not load: '+e.message; }
};
function lbClose(){ $('#lb').classList.remove('open'); $('#lbImg').src=''; document.body.style.overflow=''; }
function initLb(){
  $('#lbClose').onclick=lbClose; $('#lbBack').onclick=lbClose;
  $('#lbIn').onclick=()=>{LB.s=Math.min(LB.s*1.35,6);lbApply()};
  $('#lbOut').onclick=()=>{LB.s=Math.max(LB.s/1.35,.4);lbApply()};
  $('#lb').addEventListener('click',e=>{ if(e.target.id==='lb'||e.target.id==='lbStage') lbClose(); });
  document.addEventListener('keydown',e=>{ if(!$('#lb').classList.contains('open'))return;
    if(e.key==='Escape')lbClose(); if(e.key==='+'||e.key==='=')$('#lbIn').click(); if(e.key==='-')$('#lbOut').click(); });
  const st=$('#lbStage');
  st.addEventListener('wheel',e=>{e.preventDefault();LB.s=Math.min(Math.max(LB.s*(e.deltaY<0?1.15:1/1.15),.4),6);lbApply()},{passive:false});
  st.addEventListener('mousedown',e=>{ if(e.target.id!=='lbImg')return; LB.drag=true;LB.sx=e.clientX-LB.x;LB.sy=e.clientY-LB.y;e.preventDefault(); });
  addEventListener('mousemove',e=>{ if(LB.drag){LB.x=e.clientX-LB.sx;LB.y=e.clientY-LB.sy;lbApply()} });
  addEventListener('mouseup',()=>LB.drag=false);
  st.addEventListener('touchstart',e=>{ if(e.touches.length===1){LB.drag=true;LB.sx=e.touches[0].clientX-LB.x;LB.sy=e.touches[0].clientY-LB.y}
    else if(e.touches.length===2){LB.d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)} },{passive:true});
  st.addEventListener('touchmove',e=>{ if(e.touches.length===1&&LB.drag){LB.x=e.touches[0].clientX-LB.sx;LB.y=e.touches[0].clientY-LB.sy;lbApply()}
    else if(e.touches.length===2&&LB.d){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);LB.s=Math.min(Math.max(LB.s*(d/LB.d),.4),6);LB.d=d;lbApply()} },{passive:true});
  st.addEventListener('touchend',()=>{LB.drag=false;LB.d=null});
  $('#lbImg').addEventListener('dblclick',()=>{ if(LB.s>1){LB.s=1;LB.x=0;LB.y=0}else LB.s=2.2; lbApply(); });
}

const OTHER='__other__';
const REMEM_KEY='karjat_remem';
function loadRemem(){ try{ return JSON.parse(localStorage.getItem(REMEM_KEY)||'{}'); }catch(e){ return {}; } }
function rememOf(bucket){ const r=loadRemem(); return Array.isArray(r[bucket])?r[bucket]:[]; }
function rememAdd(bucket,val){ val=(val||'').trim(); if(!val)return;
  const r=loadRemem(); const list=Array.isArray(r[bucket])?r[bucket]:[];
  if(!list.some(x=>x.toLowerCase()===val.toLowerCase())){ list.push(val); r[bucket]=list.slice(-50); try{ localStorage.setItem(REMEM_KEY, JSON.stringify(r)); }catch(e){} }
}
// Merge base options with anything the user has previously typed for this bucket
function withRemem(bucket,base){ const seen={},out=[];
  (base||[]).concat(rememOf(bucket)).forEach(o=>{ const k=(o||'').toLowerCase(); if(o&&!seen[k]){ seen[k]=1; out.push(o); } });
  return out;
}
function selectWithOther(id,options,value,ph,bucket){
  const opts=withRemem(bucket||id,options||[]);
  const isOther = value && opts.indexOf(value)<0;
  return '<select id="'+id+'" data-bucket="'+esc(bucket||id)+'" onchange="onOther(\''+id+'\')">'
    +'<option value="">— select —</option>'
    +opts.map(o=>'<option'+(o===value?' selected':'')+'>'+esc(o)+'</option>').join('')
    +'<option value="'+OTHER+'"'+(isOther?' selected':'')+'>➕ Other…</option></select>'
    +'<div class="other-row" id="'+id+'_row" style="display:'+(isOther?'flex':'none')+'">'
    +'<input id="'+id+'_o" value="'+esc(isOther?value:'')+'" placeholder="'+esc(ph||'Type the new value')+'">'
    +'<button type="button" class="btn xs" onclick="cancelOther(\''+id+'\')">List</button></div>';
}
window.onOther=id=>{ const s=document.getElementById(id), r=document.getElementById(id+'_row');
  if(id==='k_owner'){ const rw=document.getElementById('k_retwrap'); if(rw){ const v=s.value; rw.style.display=(v&&v!==OTHER&&['Maintenance Unit','Testing Unit','Operation Unit','Third Party Agency (Owned)'].indexOf(v)<0)?'':'none'; } }
  if(!r) return; const on=s.value===OTHER; r.style.display=on?'flex':'none'; if(on) document.getElementById(id+'_o').focus(); };
window.cancelOther=id=>{ const s=document.getElementById(id); s.value=''; document.getElementById(id+'_row').style.display='none'; document.getElementById(id+'_o').value=''; };
function readSel(id){ const s=document.getElementById(id); if(!s) return '';
  if(s.value===OTHER){ const o=document.getElementById(id+'_o'); const v=o?o.value.trim():''; if(v) rememAdd(s.getAttribute('data-bucket')||id, v); return v; } return s.value; }
function isOtherUsed(id){ const s=document.getElementById(id); return s && s.value===OTHER && readSel(id); }

function fieldInput(f,val){
  const v=val==null?'':val, id='cf_'+f.key;
  let inp;
  if(f.type==='select') inp=selectWithOther(id,f.options,v,'Type a new '+f.label.toLowerCase());
  else if(f.type==='textarea') inp='<textarea id="'+id+'" rows="2">'+esc(v)+'</textarea>';
  else if(f.type==='number') inp='<input id="'+id+'" type="number" step="any" value="'+esc(v)+'">';
  else if(f.type==='date') inp='<input id="'+id+'" type="date" value="'+esc(v)+'">';
  else inp='<input id="'+id+'" value="'+esc(v)+'"'+(f.hint?' placeholder="'+esc(f.hint)+'"':'')+'>';
  return '<div class="f"><label>'+esc(f.label)+(f.required?' <span class="req">*</span>':'')+'</label>'+inp
    +(f.hint&&f.type!=='text'?'<div class="hint">'+esc(f.hint)+'</div>':'')+'</div>';
}
function readFields(c){
  const out={}, promos=[];
  (c.fields||[]).forEach(f=>{
    const id='cf_'+f.key;
    let v;
    if(f.type==='select'){ v=readSel(id); if(isOtherUsed(id) && (f.options||[]).indexOf(v)<0 && v) promos.push({kind:'field',catId:c.id,key:f.key,label:f.label,value:v}); }
    else { const el=document.getElementById(id); v=el?el.value.trim():''; }
    if(v) out[f.key]=v;
  });
  return {values:out,promos:promos};
}
/** After a save, offer to make typed "Other…" values permanent. */
function offerPromotions(promos){
  if(!promos.length) return;
  modal('Add new option'+(promos.length>1?'s':'')+' for future entries?',
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px">You typed value'+(promos.length>1?'s':'')+' that are not in the dropdown yet. Tick to add '+(promos.length>1?'them':'it')+' permanently, so next time '+(promos.length>1?'they appear':'it appears')+' in the list.</p>'
    +promos.map((p,n)=>'<label class="check" style="margin-bottom:7px"><input type="checkbox" class="promo" data-n="'+n+'" checked>'
      +'<span><b>'+esc(p.value)+'</b> <span style="color:var(--muted);font-weight:500">→ '+esc(p.kind==='uom'?'Unit of Measure list':p.label+' dropdown')+'</span></span></label>').join(''),
    '<button class="btn" onclick="closeModal()">Not now</button><button class="btn primary" onclick="applyPromos()">Add selected</button>');
  window.__promos=promos;
};
window.applyPromos=async()=>{
  const picks=[...document.querySelectorAll('.promo')].filter(c=>c.checked).map(c=>window.__promos[+c.dataset.n]);
  closeModal();
  if(!picks.length) return;
  busy(true,'Adding option'+(picks.length>1?'s':'')+'…');
  try{
    for(const p of picks){
      if(p.kind==='uom') DB=await api('addUom',[p.value]);
      else DB=await api('addFieldOption',[p.catId,p.key,p.value]);
      toast('“'+p.value+'” added to '+(p.kind==='uom'?'Unit of Measure list':p.label+' dropdown'),'ok','Dropdown updated');
    }
    busy(false); render();
  }catch(e){ busy(false); toast(e.message,'bad'); }
};

  (i.issues||[]).forEach(r=>parts.push(r.purpose,r.issuedTo,r.authNo,r.refNo,r.remarks,r.moveType,fmtDate(r.date)));

let __dragEl=null;
document.addEventListener('dragstart',e=>{ const r=e.target.closest?.('.reorder-row'); if(r){ __dragEl=r; r.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; } });
document.addEventListener('dragend',e=>{ const r=e.target.closest?.('.reorder-row'); if(r) r.classList.remove('dragging'); __dragEl=null; });
document.addEventListener('dragover',e=>{ const listEl=e.target.closest?.('#reorderList'); if(!listEl||!__dragEl)return; e.preventDefault();
  const after=[...listEl.querySelectorAll('.reorder-row:not(.dragging)')].reduce((closest,child)=>{
    const box=child.getBoundingClientRect(); const off=e.clientY-box.top-box.height/2;
    if(off<0&&off>closest.offset) return {offset:off,element:child}; return closest; },{offset:-Infinity,element:null}).element;
  if(after==null) listEl.appendChild(__dragEl); else listEl.insertBefore(__dragEl,after);
});
async function persistOrder(kind){

  try{ DB=await api('reorder',[kind,ids]); busy(false); toast('Order saved','ok'); }
  catch(e){ busy(false); toast(e.message,'bad'); }
}

function readFileB64(file){

    r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
}
window.doUploadReport=async kind=>{

  if(!f&&!fx&&!fp){toast('Attach at least one file (HTML, Excel, or PDF)','bad');return}
  $('#rpBtn').disabled=true; busy(true,'Uploading report…');
  try{ const payload={kind:kind,title:title,desc:desc,date:date};
    if(f){ payload.full=await readFileB64(f); payload.name=f.name; payload.mime=f.type||'text/html'; }
    if(fx){ payload.xlsxFull=await readFileB64(fx); payload.xlsxName=fx.name; payload.xlsxMime=fx.type||''; }
    if(fp){ payload.pdfFull=await readFileB64(fp); payload.pdfName=fp.name; }
    DB=await api('uploadReport',[payload]);
    busy(false); closeModal(); render(); toast(title+' added','ok','Report uploaded'); }
  catch(e){ busy(false); const b=$('#rpBtn'); if(b)b.disabled=false; toast(e.message,'bad','Upload failed'); }

function injectCaptureTool(w,reportTitle){
  try{
    const style=w.document.createElement('style');
    style.textContent='.__cap_hl{outline:3px solid #2E5496!important;outline-offset:2px;cursor:crosshair!important}';
    w.document.head.appendChild(style);
    const s=w.document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=()=>{
      const bar=w.document.createElement('div');
      bar.id='__captureBar';
      bar.style.cssText='position:fixed;top:10px;right:10px;z-index:999999;background:#16294d;color:#fff;padding:8px 12px;border-radius:8px;font:600 12px/1.3 -apple-system,Segoe UI,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center;max-width:calc(100vw - 20px)';
      bar.innerHTML='<span id="__capHint">📷 Save a nameplate / photo from this report to Equipment Docs</span><button id="__capToggle" style="background:#2E5496;border:0;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit;white-space:nowrap">Start</button>';
      w.document.body.appendChild(bar);
      let picking=false,hovered=null;
      const setHint=t=>{ const h=w.document.getElementById('__capHint'); if(h)h.textContent=t; };
      w.document.getElementById('__capToggle').onclick=()=>{
        picking=!picking;
        w.document.getElementById('__capToggle').textContent=picking?'Cancel':'Start';
        setHint(picking?'Hover to highlight, then click to capture':'📷 Save a nameplate / photo from this report to Equipment Docs');
      };
      w.document.addEventListener('mouseover',e=>{
        if(!picking||bar.contains(e.target))return;
        if(hovered)hovered.classList.remove('__cap_hl');
        hovered=e.target; hovered.classList.add('__cap_hl');
      });
      w.document.addEventListener('click',e=>{
        if(!picking||bar.contains(e.target))return;
        e.preventDefault(); e.stopPropagation();
        const el=e.target; if(hovered)hovered.classList.remove('__cap_hl');
        setHint('Capturing…');
        w.html2canvas(el,{backgroundColor:'#ffffff',scale:2}).then(canvas=>{
          picking=false; w.document.getElementById('__capToggle').textContent='Start';
          setHint('📷 Save a nameplate / photo from this report to Equipment Docs');
          window.opener.captureReportImage(canvas.toDataURL('image/jpeg',0.9),reportTitle);
        }).catch(()=>{ setHint('Could not capture that — try a different area'); });
      },true);
    };
    w.document.head.appendChild(s);
  }catch(e){ /* capture tool is a bonus feature; the report itself still opened fine without it */ }
}
function resizeDataUrl(src,max,q){
  return new Promise((res,rej)=>{ const im=new Image();
    im.onload=()=>{ const sc=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',q).split(',')[1]); };
    im.onerror=rej; im.src=src; });
}

window.rptExpSelectAll=on=>{ document.querySelectorAll('.rptchk').forEach(c=>c.checked=on); rptExpCount(); };
window.rptExpCount=()=>{ const n=document.querySelectorAll('.rptchk:checked').length; const el=$('#rptExpCount'); if(el) el.textContent=n+' selected'; };
function selectedReportIds(){ return [...document.querySelectorAll('.rptchk:checked')].map(c=>c.value); }
function b64ToBlob(b64,mime){ const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }
function dlNamed(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); }
function safeName(s){ return (s||'report').replace(/[^A-Za-z0-9]+/g,'_').slice(0,60); }
window.doExportReports=async format=>{
  const ids=selectedReportIds(); const kind=window.__rptExpKind;
  if(!ids.length){ toast('Select at least one report','bad'); return; }
  const reports=ids.map(id=>DB.reports.find(r=>r.id===id)).filter(Boolean);
  closeModal(); busy(true,'Preparing '+reports.length+' file(s)…');
  try{
    if(format==='excel'){
      // Fallback: uploaded xlsx → else generated single-report sheet
      for(const r of reports){
        if(r.hasXlsx){ const b64=await api('getReportFile',[r.id,'xlsx']); dlNamed(b64ToBlob(b64,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'), r.xlsxName||safeName(r.title)+'.xlsx'); }
        else { const sheet={name:'Report',rows:[['Field','Value'],['Title',r.title],['Description',r.desc||''],['Date',fmtDate(r.date)],['Type',kind==='issued'?'Issued / Dispatch':'Receipt / Inward'],['HTML attached',r.hasHtml?'Yes':'No'],['PDF attached',r.hasPdf?'Yes':'No']],widths:[20,60],headerFill:'305496'};
          dlBlob(buildXlsx([sheet]), safeName(r.title)+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); }
        await sleep(400);
      }
      busy(false); toast(reports.length+' Excel file(s) downloaded','ok','Export complete');
    } else {
      // PDF/print: uploaded PDF → else open HTML report(s) for print → else a generated summary
      let pdfCount=0, htmlList=[];
      for(const r of reports){
        if(r.hasPdf){ const b64=await api('getReportFile',[r.id,'pdf']); dlNamed(b64ToBlob(b64,'application/pdf'), r.pdfName||safeName(r.title)+'.pdf'); pdfCount++; await sleep(400); }
        else if(r.hasHtml){ htmlList.push(r); }
        else { htmlList.push(r); } // generated summary fallback
      }
      busy(false);
      if(htmlList.length){ await printReportsHtml(htmlList,kind); }
      if(pdfCount) toast(pdfCount+' PDF(s) downloaded'+(htmlList.length?' · HTML report(s) opened for print':''),'ok','Export complete');
    }
  }catch(e){ busy(false); toast(e.message,'bad','Export failed'); }
};
// Open each HTML report in its own tab for Save-as-PDF; generated summary if no HTML
async function printReportsHtml(reports,kind){
  for(const r of reports){
    if(r.hasHtml){
      try{ const html=await api('getReportFile',[r.id,'html']); const w=window.open('','_blank');
        if(w){ w.document.open(); w.document.write(html); w.document.close(); setTimeout(()=>{try{w.print();}catch(e){}},600); } }
      catch(e){ toast('Could not open '+r.title,'bad'); }
    } else {
      const w=window.open('','_blank');
      if(w){ w.document.open(); w.document.write('<html><head><title>'+esc(r.title)+'</title></head><body style="font-family:Segoe UI,sans-serif;padding:30px">'
        +'<h2 style="color:#16294d">'+esc(r.title)+'</h2><p><b>Date:</b> '+fmtDate(r.date)+' &nbsp; <b>Type:</b> '+(kind==='issued'?'Issued / Dispatch':'Receipt / Inward')+'</p>'
        +'<p>'+esc(r.desc||'')+'</p><p style="color:#888;font-size:12px">No detailed HTML/PDF was attached to this report.</p></body></html>');
        w.document.close(); setTimeout(()=>{try{w.print();}catch(e){}},500); }
    }
    await sleep(500);
  }
}

  let brief='', docs=[], unlinkKind=null, unlinkId=null;
  if(S.doctab==='all'){ docs=itemDocs(i);
    brief='<dl class="dl">'+row('Material',i.name)+row('Category',cat(i.categoryId).name)+row('Documents',docs.length+' file(s) linked')+'</dl>'; }
  else if(S.doctab==='item'){ docs=(i.docs||[]).filter(d=>doc_(d)); unlinkKind='item'; unlinkId=i.id;
    brief='<dl class="dl">'+row('Scope','Documents attached to the material itself (nameplates, manuals, test reports)')+'</dl>'; }
  else if(S.doctab[0]==='r'){ const r=(i.receipts||[]).find(x=>'r'+x.id===S.doctab);
    if(r){ docs=(r.docs||[]).filter(d=>doc_(d)); unlinkKind='receipt'; unlinkId=r.id;
      brief='<dl class="dl">'+row('Date of Receipt',fmtDate(r.date))+row('Quantity',fmtN(r.qty)+' '+(i.unit||''))+row('Received From',r.source)

        +(r.totalAmt?row('Total Amount',money(r.totalAmt)):'')+row('Received By',r.receivedBy)+row('Remarks',r.remarks)+'</dl>'; } }
  else { const r=(i.issues||[]).find(x=>'i'+x.id===S.doctab);
    if(r){ docs=(r.docs||[]).filter(d=>doc_(d)); unlinkKind='issue'; unlinkId=r.id;
      brief='<dl class="dl">'+row('Date of Issue',fmtDate(r.date))+row('Quantity',fmtN(r.qty)+' '+(i.unit||''))+row('Purpose',r.purpose)
        +row('Issued To',r.issuedTo)+row('Work / Details',r.workDetails)+row('Authorised By',r.authorisedBy)+'</dl>'; } }
  return '<div class="subtabs no-print">'+groups.map(g=>'<button class="'+(S.doctab===g.key?'on':'')+'" onclick="setDocTab(\''+g.key+'\')">'+esc(g.label)+'</button>').join('')+'</div>'

  +'<div class="card" data-sec="sec-docs"><div class="card-h"><h3>Attachments</h3><span class="tag g">'+docs.length+'</span><div class="spacer"></div>'
  +(unlinkKind?'<button class="btn sm no-print" onclick="openLink(\''+unlinkKind+'\',\''+unlinkId+'\')">Link existing</button> <button class="btn sm primary no-print" onclick="openUpload(\''+unlinkKind+'\',\''+unlinkId+'\')">+ Upload</button>':'')
  +'</div><div class="card-b">'
  +(docs.length?'<div class="gal">'+docs.map(d=>docCard(doc_(d),null,unlinkKind?'unlinkDoc(\''+unlinkKind+'\',\''+unlinkId+'\',\''+d+'\')':null)).join('')+'</div>'
    :'<div class="empty"><p>No documents in this group.</p>'+(unlinkKind?'<p class="no-print"><button class="btn sm" onclick="openLink(\''+unlinkKind+'\',\''+unlinkId+'\')">Link existing document</button></p>':'')+'</div>')
  +'</div></div>';
}

window.setRegCat=v=>{S.regCat=v;render()};
window.toggleLow=()=>{ const on=$('#r_tracklow').checked; $('#lowWrap').style.display=on?'':'none'; if(on)$('#r_lowcut').focus(); };
window.calcAmt=(t)=>{ const q=Number($('#r_qty').value||0),r=Number($('#r_rate').value||0),g=Number($('#r_gst').value||0);
  const tx=$('#r_tax'),tot=$('#r_total'); if(t)tx.dataset.touched='1';
  if(r&&q&&!tx.dataset.touched) tx.value=+(r*q).toFixed(2);
  const tv=Number(tx.value||0); if(tv&&!tot.dataset.touched) tot.value=+(tv*(1+g/100)).toFixed(2);
  const vf=$('#r_val'); if(vf&&r&&!vf.dataset.touched) vf.value=r; };
window.submitReg=async e=>{
  e.preventDefault();
  const c=cat(S.regCat||DB.categories[0].id);
  const fr=readFields(c);
  const miss=(c.fields||[]).filter(f=>f.required&&!fr.values[f.key]);
  if(miss.length){ toast('Required: '+miss.map(f=>f.label).join(', '),'bad','Missing fields'); return false; }
  const unit=readSel('r_unit');
  if(!unit){ toast('Choose or type a unit of measure','bad'); return false; }
  const track=$('#r_tracklow').checked, cut=$('#r_lowcut').value;
  if(track && cut===''){ toast('Enter the low-stock cut-off value','bad'); $('#r_lowcut').focus(); return false; }
  const promos=fr.promos.slice();
  if(isOtherUsed('r_unit') && DB.uoms.indexOf(unit)<0) promos.push({kind:'uom',label:'Unit of Measure',value:unit});
  const p={categoryId:c.id,name:$('#r_name').value.trim(),unit:unit,location:$('#r_loc').value.trim(),
    unitValue:Number($('#r_val').value||0),routineTest:$('#r_routine').checked,
    trackLow:track,lowCutoff:track?Number(cut):0,fields:fr.values,remarks:'',
    receipt:{date:$('#r_date').value,qty:Number($('#r_qty').value||0),source:$('#r_src').value.trim(),
      refType:readSel('r_reftype'),refNo:$('#r_refno').value.trim(),invoiceNo:$('#r_inv').value.trim(),
      vehicle:$('#r_veh').value.trim(),receivedBy:$('#r_by').value.trim(),unitRate:Number($('#r_rate').value||0),
      taxableAmt:Number($('#r_tax').value||0),gstPct:Number($('#r_gst').value||0),totalAmt:Number($('#r_total').value||0),
      remarks:$('#r_rem').value.trim(),docs:[]}};
  $('#regBtn').disabled=true; busy(true,'Saving to Google Sheet…');
  try{ p.receipt.docs=await uploadEntryPhotos('mreg'); const before=DB.items.map(x=>x.id); DB=await api('addItem',[p]);
    const n=DB.items.find(x=>before.indexOf(x.id)<0);
    busy(false); toast(p.name+' registered with '+fmtN(p.receipt.qty)+' '+unit,'ok','Material saved');
    if(promos.length) offerPromotions(promos);
    if(n){ S.hist.push({page:'register'}); S.itemId=n.id; S.tab='summary'; S.page='item'; render(); } else go('available');
  }catch(err){ busy(false); $('#regBtn').disabled=false; toast(err.message,'bad','Could not save'); }
  return false;
};

/* ======================================================================== *
 *  TEST KIT MANAGEMENT
 * ======================================================================== */
const kit=id=>DB.kits.find(k=>k.id===id);
function kitDocsAll(k){ const s=new Set(k.docs||[]); (k.moves||[]).forEach(m=>(m.docs||[]).forEach(d=>s.add(d))); (k.repairs||[]).forEach(r=>(r.docs||[]).forEach(d=>s.add(d))); return [...s].filter(d=>doc_(d)); }
function kitOpenRepair(k){ return (k.repairs||[]).slice().sort((a,b)=>(b.dateSent||'').localeCompare(a.dateSent||'')).find(r=>r.status!=='Received')||null; }
function kitOpenMove(k){ const mv=(k.moves||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')); const last=mv[mv.length-1]; return (last&&last.direction==='OUT')?last:null; }
const OWNED_TYPES=['Maintenance Unit','Testing Unit','Operation Unit','Third Party Agency (Owned)'];
function isBorrowedKit(k){ return k && k.ownership && OWNED_TYPES.indexOf(k.ownership)<0; }
function kitLocationStatus(k){
  const borrowed=isBorrowedKit(k);
  const openRepair=kitOpenRepair(k);
  if(openRepair) return {kind:'bad',label:'At Repair / Calibration',detail:'With '+(openRepair.sentTo||'—')+' since '+fmtDate(openRepair.dateSent)+' — '+(openRepair.reason||'reason not specified')};
  const last=kitOpenMove(k);
  if(last){
    return borrowed
      ? {kind:'ok',label:'Returned — Not at Substation',detail:'Sent to '+(last.party||'—')+' on '+fmtDate(last.date)+' — '+(last.reason||'reason not specified')}
      : {kind:'warn',label:'Given to '+(last.party||'—'),detail:'Since '+fmtDate(last.date)+' — '+(last.reason||'reason not specified')};
  }
  return borrowed
    ? {kind:'warn',label:'On Loan — At Our Substation',detail:(k.ownerDetail?('Owner: '+k.ownerDetail+'. '):'')+'Borrowed kit, currently with us — remember to return when no longer needed.'}
    : {kind:'ok',label:'Available at Substation',detail:k.location||'400 kV Karjat Substation'};
}
function kitHealthCls(s){ s=s||'Healthy'; if(s==='Healthy')return 'Healthy'; if(s==='Faulty')return 'Faulty'; if(/severe/i.test(s))return 'sev'; return 'minor'; }
function kitHealthTag(k){ return '<span class="healthpill '+kitHealthCls(k.status)+'">'+esc(k.status||'Healthy')+'</span>'; }

function kitAttentionCount(){
  return DB.kits.filter(k=>{
    const cls=kitHealthCls(k.status);
    return kitLocationStatus(k).kind==='bad' || cls==='Faulty' || cls==='sev';
  }).length;
}

  const givenOut=withLS.filter(o=>o.ls.kind==='warn');
  const atRepair=withLS.filter(o=>o.ls.kind==='bad');
  const healthy=kits.filter(k=>kitHealthCls(k.status)==='Healthy');
  const minor=kits.filter(k=>kitHealthCls(k.status)==='minor');
  const severe=kits.filter(k=>kitHealthCls(k.status)==='sev');
  const faulty=kits.filter(k=>kitHealthCls(k.status)==='Faulty');
  const attnMap=new Map();
  atRepair.forEach(o=>attnMap.set(o.k.id,o.k));

  const attn=[...attnMap.values()];

    +attn.map(k=>{const ls=kitLocationStatus(k);
      return '<tr class="clickable" onclick="openKit(\''+k.id+'\')"><td><b>'+esc(k.name)+'</b></td><td><span class="tag n">'+esc(cat(k.categoryId).name)+'</span></td>'

  +(out.length?'<div class="tw"><table><thead><tr><th>Kit</th><th>Category</th><th>Status</th><th>Detail</th></tr></thead><tbody>'
    +out.map(o=>{const k=o.k,ls=o.ls;
      return '<tr class="clickable" onclick="openKit(\''+k.id+'\')"><td><b>'+esc(k.name)+'</b></td><td><span class="tag n">'+esc(cat(k.categoryId).name)+'</span></td>'

    +'</tbody></table></div>':'<div class="empty"><p><b>All kits are at the substation.</b></p></div>')+'</div>'

function kitOwnershipTabs(){
  const core=['Maintenance Unit','Testing Unit','Operation Unit'];
  const present=[...new Set(DB.kits.map(k=>k.ownership).filter(Boolean))];
  const others=present.filter(o=>core.indexOf(o)<0);
  return [{key:'all',label:'All Testing Equipments'}]
    .concat(core.map(o=>({key:o,label:o})))
    .concat(others.map(o=>({key:o,label:o})));
}

window.setKitRegCat=v=>{S.kitRegCat=v;render()};
window.submitKitReg=async e=>{
  e.preventDefault();
  const c=cat(S.kitRegCat||DB.categories.find(x=>x.kind==='kit').id);
  const fr=readFields(c);
  const miss=(c.fields||[]).filter(f=>f.required&&!fr.values[f.key]);
  if(miss.length){ toast('Required: '+miss.map(f=>f.label).join(', '),'bad'); return false; }
  const ownership=readSel('k_owner'), status=readSel('k_status');
  if(!ownership){ toast('Choose or type an ownership type','bad'); return false; }
  if(!status){ toast('Choose or type a status','bad'); return false; }
  const promos=fr.promos.slice();
  if(isOtherUsed('k_owner') && DB.ownerships.indexOf(ownership)<0) promos.push({kind2:'kitOwnerships',label:'Ownership',value:ownership});
  if(isOtherUsed('k_status') && DB.kitStatuses.indexOf(status)<0) promos.push({kind2:'kitStatuses',label:'Kit Status',value:status});
  $('#kitRegBtn').disabled=true; busy(true,'Saving…');
  try{
    const kdocs=await uploadEntryPhotos('kreg');
    const returnReq = (ownership && ['Maintenance Unit','Testing Unit','Operation Unit','Third Party Agency (Owned)'].indexOf(ownership)<0) ? (($('#k_return')||{}).checked!==false) : false;
    const before=DB.kits.map(k=>k.id);
    DB=await api('addKit',[{categoryId:c.id,name:$('#k_name').value.trim(),ownership,ownerDetail:$('#k_ownerdetail').value.trim(),
      status,location:$('#k_loc').value.trim(),fields:fr.values,remarks:$('#k_rem').value.trim(),returnRequired:returnReq,docs:kdocs}]);
    const n=DB.kits.find(k=>before.indexOf(k.id)<0);
    busy(false); toast($('#k_name').value.trim()+' registered','ok','Kit saved');
    if(promos.length) offerKitPromotions(promos);
    if(n){ S.hist.push({page:'kitregister'}); S.kitId=n.id; S.kittab='summary'; S.page='kit'; render(); } else go('kits');
  }catch(err){ busy(false); $('#kitRegBtn').disabled=false; toast(err.message,'bad'); }
  return false;
};
function offerKitPromotions(promos){
  if(!promos.length) return;
  modal('Add new option'+(promos.length>1?'s':'')+' for future kits?',
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px">Tick to add permanently.</p>'
    +promos.map((p,n)=>'<label class="check" style="margin-bottom:7px"><input type="checkbox" class="kpromo" data-n="'+n+'" checked><span><b>'+esc(p.value)+'</b> <span style="color:var(--muted);font-weight:500">→ '+esc(p.label)+' list</span></span></label>').join(''),
    '<button class="btn" onclick="closeModal()">Not now</button><button class="btn primary" onclick="applyKitPromos()">Add selected</button>');
  window.__kpromos=promos;
}
window.applyKitPromos=async()=>{
  const picks=[...document.querySelectorAll('.kpromo')].filter(c=>c.checked).map(c=>window.__kpromos[+c.dataset.n]);
  closeModal(); if(!picks.length)return;
  busy(true,'Saving…');
  try{ for(const p of picks){ DB=await api('addListSetting',[p.kind2,p.value]); toast('"'+p.value+'" added to '+p.label,'ok'); } busy(false); render(); }
  catch(e){ busy(false); toast(e.message,'bad'); }
};

  return printHead(k.name,c.name)+crumb(['Test Kits','go(\'kits\')'],[k.name,''])
  +'<div class="statusbanner '+ls.kind+'"><div><div class="sb-t">Current Status</div><div class="sb-v">'+esc(ls.label)+'</div></div><div style="opacity:.9;font-size:12.5px">'+esc(ls.detail)+'</div><div class="spacer"></div>'+kitHealthTag(k)+'</div>'
  +'<div class="page-head"><div><h1>'+esc(k.name)+'</h1><div class="sub"><span class="tag n">'+esc(c.name)+'</span> <span class="tag g">'+esc(k.ownership||'—')+'</span></div></div><div class="spacer"></div>'
  +'<div class="acts no-print"><button class="btn back" onclick="back()">← Back</button><button class="btn" onclick="openExport(\'kits\',[\''+k.id+'\'])">Export</button>'
  +(canEdit()?'<button class="btn" onclick="openEditKit(\''+k.id+'\')">Edit</button>'
    +(openRep?'<button class="btn primary" onclick="openKitReceiveRepair(\''+k.id+'\')">Receive from Repair</button>'
      :openMv?'<button class="btn warn" onclick="openKitTakeBack(\''+k.id+'\')">'+(borrowed?'Mark Received Back':'Take Back')+'</button>'
      :'<button class="btn" onclick="openKitGiveOut(\''+k.id+'\')">'+(borrowed?'Return to Owner':'Give Out')+'</button><button class="btn primary" onclick="openKitRepair(\''+k.id+'\')">Send for Repair</button>')
    :'')+'</div></div>'
  +'<div class="tabs no-print">'
  +[['summary','Summary'],['moves','Give &amp; Take History'],['repairs','Repair History'],['remarks','Remarks'],['docs','Documents']]
    .map(t=>'<button class="'+(S.kittab===t[0]?'on':'')+'" onclick="setKitTab(\''+t[0]+'\')">'+t[1]+(t[0]==='docs'?' ('+kitDocsAll(k).length+')':t[0]==='remarks'&&(k.issuesFaced||[]).length?' ('+(k.issuesFaced||[]).length+')':'')+'</button>').join('')
  +'</div><div style="margin-top:13px">'+body+'</div>';

function kitTabRemarks(k){
  const sub=S.kitRemTab==='issues'?'issues':'ops';
  let out='<div class="subtabs no-print">'
    +'<button class="'+(sub==='ops'?'on':'')+'" onclick="setKitRemTab(\'ops\')">Operational Information</button>'
    +'<button class="'+(sub==='issues'?'on':'')+'" onclick="setKitRemTab(\'issues\')">Issues Faced'+((k.issuesFaced||[]).length?' ('+(k.issuesFaced||[]).length+')':'')+'</button></div>';
  if(sub==='ops'){
    // (a) webpage remarks (free long text on the kit) + (b) the Google-Sheet operational log
    out+='<div class="card" data-sec="sec-remarks" style="margin-bottom:12px"><div class="card-h"><h3>Operational Notes</h3><div class="spacer"></div>'
      +(canEdit()?'<button class="btn sm no-print" onclick="openEditKitRemarks(\''+k.id+'\')">Edit notes</button>':'')+'</div>'
      +'<div class="card-b" style="white-space:pre-wrap;font-size:12.5px;line-height:1.6">'+(k.remarks?esc(k.remarks):'<span style="color:var(--muted)">No operational notes yet — how to operate, connection settings, calibration references, do/don\'t.</span>')+'</div></div>';
    if(!k.opSheetId){
      out+='<div class="card"><div class="card-h"><h3>Operational Information Sheet</h3></div><div class="card-b"><div class="empty"><p><b>No sheet yet.</b></p>'
        +(canEdit()?'<p class="no-print"><button class="btn primary" onclick="ensureKitSheet(\''+k.id+'\')">Create Operational Info sheet</button></p>':'<p>An editor can create it.</p>')
        +'<p style="font-size:12px;color:var(--muted)">Or run <b>ensureAllSheets()</b> once in Apps Script to create every kit\'s sheet at once.</p></div></div></div>';
    } else {
      const embed='https://docs.google.com/spreadsheets/d/'+k.opSheetId+'/preview';
      const edit='https://docs.google.com/spreadsheets/d/'+k.opSheetId+'/edit';
      out+='<div class="card" data-sec="sec-sheet"><div class="card-h"><h3>Operational Information Sheet</h3><span class="tag ok">Live</span><div class="spacer"></div>'
        +'<a class="btn sm no-print" href="'+edit+'" target="_blank" rel="noopener">✎ Edit in Google Sheets</a></div>'

        +'<div class="hint">All tabs and formatting from the sheet appear here. Use Edit to add or change entries.</div></div></div>';
    }
    return out;
  }
  // Issues Faced — reverse chronological
  const issues=(k.issuesFaced||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  out+='<div class="card"><div class="card-h"><span class="dot" style="background:var(--warn)"></span><h3>Issues Faced</h3><span class="tag g">'+issues.length+'</span><div class="spacer"></div>'
    +(canEdit()?'<button class="btn sm primary no-print" onclick="openKitIssue(\''+k.id+'\')">+ Log Issue</button>':'')+'</div>';
  if(!issues.length){ out+='<div class="empty"><p><b>No issues logged.</b></p><p style="font-size:12px">Record any fault or quirk faced while operating this kit, newest first.</p></div></div>'; return out; }
  out+='<div class="tw"><table><thead><tr><th>Date</th><th>Issue</th><th>Severity</th><th>Status</th><th>Remarks</th><th class="no-print"></th></tr></thead><tbody>'
    +issues.map(x=>'<tr><td class="mono">'+fmtDate(x.date)+'</td><td><b>'+esc(x.issue)+'</b></td>'
      +'<td>'+(x.severity?'<span class="tag '+(x.severity==='Severe'?'bad':x.severity==='Minor'?'warn':'n')+'">'+esc(x.severity)+'</span>':'—')+'</td>'
      +'<td>'+(x.resolved?'<span class="tag ok">Resolved'+(x.resolvedDate?' '+fmtDate(x.resolvedDate):'')+'</span>':'<span class="tag bad">Open</span>')+'</td>'
      +'<td style="font-size:11.5px;color:var(--muted)">'+esc(x.remarks||'—')+'</td>'
      +'<td class="no-print" style="text-align:right;white-space:nowrap">'+(canEdit()?'<button class="btn xs" onclick="openKitIssueEdit(\''+k.id+'\',\''+x.id+'\')">Edit</button> ':'')
      +(isAdmin()?'<button class="btn xs danger" onclick="delKitIssue(\''+x.id+'\')">Delete</button>':'')+'</td></tr>').join('')
    +'</tbody></table></div></div>';
  return out;
}

window.__entryPhotos={};
function photoAttachField(slot,label){
  window.__entryPhotos[slot]=[];
  return '<div class="f" style="margin-top:10px"><label>'+esc(label||'Attach photo(s)')+'</label>'
    +'<input type="file" accept="image/*" multiple onchange="stageEntryPhotos(\''+slot+'\',this.files)">'
    +'<div class="hint">Gate pass, kit condition, documents — optional, added to Equipment Docs and linked to this entry.</div>'
    +'<div id="ph_'+slot+'" class="phchips"></div></div>';
}
window.stageEntryPhotos=async(slot,files)=>{
  const arr=window.__entryPhotos[slot]||(window.__entryPhotos[slot]=[]);
  let failed=0;
  for(const f of files){ try{ const full=await resizeImg(f,1600,.82), thumb=await resizeImg(f,240,.6);
    arr.push({name:f.name,full,thumb,title:f.name.replace(/\.[^.]+$/,'')}); }catch(e){ failed++; } }
  if(failed) toast(failed+' image'+(failed>1?'s':'')+' could not be read (unsupported or corrupt) and '+(failed>1?'were':'was')+' skipped','warn','Photos');
  paintPhotoChips(slot);
};
function paintPhotoChips(slot){ const box=document.getElementById('ph_'+slot); if(!box)return;
  const arr=window.__entryPhotos[slot]||[];
  box.innerHTML=arr.map((p,i)=>'<span class="phchip">📷 '+esc(p.title.slice(0,22))+' <b onclick="unstageEntryPhoto(\''+slot+'\','+i+')">✕</b></span>').join(''); }
window.unstageEntryPhoto=(slot,i)=>{ (window.__entryPhotos[slot]||[]).splice(i,1); paintPhotoChips(slot); };
async function uploadEntryPhotos(slot){
  const arr=window.__entryPhotos[slot]||[]; const ids=[]; let failed=0;
  for(const p of arr){
    try{ const res=await api('uploadDoc',[{title:p.title,name:p.name,mime:'image/jpeg',full:p.full,thumb:p.thumb}]);
      DB=res; if(res.newDocId) ids.push(res.newDocId); }
    catch(e){ failed++; }
  }
  window.__entryPhotos[slot]=[];
  if(failed) toast(failed+' photo'+(failed>1?'s':'')+' could not be uploaded and '+(failed>1?'were':'was')+' skipped ('+ids.length+' uploaded)','warn','Attachments');
  return ids;
}

function kitSheets(ids){
  const kits=DB.kits.filter(k=>ids.includes(k.id));
  if(kits.length===1){
    const k=kits[0], c=cat(k.categoryId);
    const info=[['Field','Value'],['Kit Name',k.name],['Category',c.name],['Ownership',k.ownership||''],['Owner Detail',k.ownerDetail||''],['Status',k.status||''],['Location',k.location||'']];
    (c.fields||[]).forEach(f=>info.push([f.label,String((k.fields&&k.fields[f.key])||'')]));
    if(k.remarks) info.push(['Remarks',k.remarks]);
    const mh=[['Direction','Date','Party','Reason','Reference','Expected Return','Actual Return','Remarks']];
    (k.moves||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(m=>mh.push([m.direction,fmtDate(m.date),m.party||'',m.reason||'',[m.refType,m.refNo].filter(Boolean).join(' '),fmtDate(m.expectedReturn),fmtDate(m.actualReturn),m.remarks||'']));
    const rh=[['Date Sent','Sent To','Reason','Expense Before','Status','Date Received','Actual Expense','Issues','Remarks']];
    (k.repairs||[]).slice().sort((a,b)=>(a.dateSent||'').localeCompare(b.dateSent||'')).forEach(r=>rh.push([fmtDate(r.dateSent),r.sentTo||'',r.reason||'',Number(r.expenseBefore||0),r.status||'',fmtDate(r.dateReceived),Number(r.actualExpense||0),(r.issues||[]).map(x=>x.desc+(x.resolved?' [Resolved]':' [Open]')).join(' | '),r.remarks||'']));
    return [{name:'Summary',rows:info,widths:[26,50]},{name:'Give & Take',rows:mh,widths:[10,12,22,18,22,14,14,26]},{name:'Repairs',rows:rh,widths:[12,20,18,13,10,14,13,40,24]}];
  }
  const s1=[['Sr.','Kit Name','Category','Ownership','Status','Current Status']];
  kits.forEach((k,n)=>{ const ls=kitLocationStatus(k); s1.push([n+1,k.name,cat(k.categoryId).name,k.ownership||'',k.status||'',ls.label+' — '+ls.detail]); });
  return [{name:'Kits',rows:s1,widths:[5,34,22,26,18,44]}];
}

  +photoAttachField('missue','Attach photo(s) — authorisation, gate pass, work photo');
}
function readIssue(){ return {moveType:$('#ai_movetype').value,date:$('#ai_date').value,qty:Number($('#ai_qty').value||0),purpose:$('#ai_purpose').value.trim(),

window.openIssuePicker=()=>{
  window.__issPickList=DB.items.filter(i=>availQty(i)>0).sort((a,b)=>a.name.localeCompare(b.name));

window.pickIssueItem=id=>{ closeModal(); setTimeout(()=>openIssue(id),80); };
window.openIssue=id=>modal('Issue / Consume — '+item(id).name, issueForm(item(id),null),
  '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="aiBtn" onclick="saveIssue(\''+id+'\')">Record Issue</button>');
window.saveIssue=async id=>{ const p=readIssue();
  if(!(p.qty>0)){toast('Enter quantity','bad');return}
  if(!p.purpose){toast('Purpose of use is required','bad');return}
  $('#aiBtn').disabled=true; busy(true,'Saving…');
  try{ p.docs=await uploadEntryPhotos('missue'); DB=await api('addIssue',[id,p]); busy(false); closeModal(); S.tab='used'; render();
    const i=item(id); toast(i.name+' — balance now '+fmtN(availQty(i))+' '+(i.unit||''),'ok','Issue recorded');

window.openIssueEdit=(iid,rid)=>{ const i=item(iid), r=(i.issues||[]).find(x=>x.id===rid);

    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="aiBtn" onclick="saveIssueEdit(\''+iid+'\',\''+rid+'\')">Save changes</button>'); };
window.saveIssueEdit=async(iid,rid)=>{ const p=readIssue();
  if(!(p.qty>0)){toast('Enter quantity','bad');return}
  if(!p.purpose){toast('Purpose of use is required','bad');return}
  $('#aiBtn').disabled=true; busy(true,'Saving…');
  try{ DB=await api('updateIssue',[rid,p]); busy(false); closeModal(); render();
    const i=item(iid); toast(i.name+' — balance now '+fmtN(availQty(i))+' '+(i.unit||''),'ok','Issue updated'); }
  catch(e){ busy(false); const b=$('#aiBtn'); if(b)b.disabled=false; toast(e.message,'bad','Could not save'); } };
window.revertIssue=async(iid,rid)=>{ const i=item(iid), r=(i.issues||[]).find(x=>x.id===rid);
  if(!confirm('Revert this issue?\n\n'+fmtN(r.qty)+' '+(i.unit||'')+' will go back into stock and the record will be removed.'))return;
  busy(true,'Reverting…');
  try{ DB=await api('deleteRecord',['issues',rid]); busy(false); render();
    const it=item(iid); toast(fmtN(r.qty)+' '+(it.unit||'')+' returned — balance now '+fmtN(availQty(it)),'ok','Issue reverted'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.delRec=async(kind,rid)=>{
  if(!confirm('Delete this '+(kind==='receipts'?'receipt':'issue')+' permanently?'))return;
  busy(true,'Deleting…');
  try{ DB=await api('deleteRecord',[kind,rid]); busy(false); render(); toast((kind==='receipts'?'Receipt':'Issue')+' deleted','ok'); }
  catch(e){ busy(false); toast(e.message,'bad','Could not delete'); } };
window.delItem=async id=>{ const i=item(id);
  if(!confirm('Delete “'+i.name+'” and ALL its receipts and issues?\n\nThis cannot be undone.'))return;
  busy(true,'Deleting…');
  try{ DB=await api('deleteItem',[id]); busy(false); go('available'); toast(i.name+' removed','ok','Material deleted'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.openEditItem=id=>{ const i=item(id),c=cat(i.categoryId);
  modal('Edit — '+i.name,
    '<div class="grid2"><div class="f"><label>Item Name</label><input id="e_name" value="'+esc(i.name)+'"></div>'
    +'<div class="f"><label>Unit of Measure</label>'+selectWithOther('e_unit',DB.uoms,i.unit||'','Type a new unit','uom')+'</div>'
    +'<div class="f"><label>Store / Location</label><input id="e_loc" value="'+esc(i.location||'')+'"></div>'
    +'<div class="f"><label>Material Value — per '+esc(i.unit||'unit')+' (₹)</label><input id="e_val" type="number" step="any" min="0" value="'+esc(i.unitValue||'')+'" placeholder="'+esc(unitValOf(i)?('≈ '+Math.round(unitValOf(i))+' from bills'):'Enter value per unit')+'"><div class="hint">Drives Available Material Value. Leave blank to auto-use the average bill rate.</div></div>'
    +'<div class="f"><label class="check"><input type="checkbox" id="e_routine" '+(i.routineTest?'checked':'')+'><span>Eligible for routine testing (Test Results sheet)</span></label></div></div>'
    +'<fieldset style="margin-top:12px"><legend>'+esc(c.name)+'</legend><div class="grid2">'
    +(c.fields||[]).map(f=>fieldInput(f,i.fields&&i.fields[f.key])).join('')+'</div></fieldset>'
    +'<div class="f"><label>Remarks</label><textarea id="e_rem" rows="2">'+esc(i.remarks||'')+'</textarea></div>'
    +photoAttachField('medit','Attach photo(s) to this material'),
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveItem(\''+id+'\')">Save</button>',true); };
window.saveItem=async id=>{ const i=item(id),c=cat(i.categoryId), fr=readFields(c);
  const unit=readSel('e_unit')||i.unit;
  const promos=fr.promos.slice();
  if(isOtherUsed('e_unit') && DB.uoms.indexOf(unit)<0) promos.push({kind:'uom',label:'Unit of Measure',value:unit});
  busy(true,'Saving…');
  try{ const newDocs=await uploadEntryPhotos('medit');
    DB=await api('updateItem',[id,{name:$('#e_name').value.trim()||i.name,unit:unit,location:$('#e_loc').value.trim(),
      unitValue:Number($('#e_val').value||0),routineTest:$('#e_routine').checked,
      trackLow:i.trackLow,lowCutoff:i.lowCutoff,fields:fr.values,remarks:$('#e_rem').value.trim()}]);
    if(newDocs.length) DB=await api('linkDocs',['item',id,newDocs]);
    busy(false); closeModal(); render(); toast(item(id).name,'ok','Material updated');
    if(promos.length) offerPromotions(promos); }
  catch(e){ busy(false); toast(e.message,'bad'); } };

/* ---------- documents ---------- */
function findRecordDocs_(kind,id){
  if(kind==='item') return (item(id)||{}).docs||[];
  if(kind==='receipt') return (DB.items.flatMap(i=>i.receipts||[]).find(r=>r.id===id)||{}).docs||[];
  if(kind==='issue') return (DB.items.flatMap(i=>i.issues||[]).find(r=>r.id===id)||{}).docs||[];
  if(kind==='kit') return (kit(id)||{}).docs||[];
  if(kind==='kitmove') return (DB.kits.flatMap(k=>k.moves||[]).find(r=>r.id===id)||{}).docs||[];
  if(kind==='kitrepair') return (DB.kits.flatMap(k=>k.repairs||[]).find(r=>r.id===id)||{}).docs||[];
  return [];
}
window.openLink=(kind,id)=>{
  const cur=new Set(findRecordDocs_(kind,id));
  const avail=DB.docs.filter(d=>!cur.has(d.id));
  modal('Link an existing document',
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 10px">Files stay in the one Drive folder — this just points to them.</p>'
    +(avail.length?'<div class="gal">'+avail.map(d=>'<figure><div class="imgwrap"><img src="'+(d.thumb||'')+'" alt=""></div><figcaption>'+esc(d.title)+'</figcaption>'
      +'<div class="drow"><label style="flex:1;display:flex;align-items:center;gap:5px;justify-content:center;cursor:pointer"><input type="checkbox" class="lchk" value="'+d.id+'"> pick</label></div></figure>').join('')+'</div>'
      :'<div class="empty"><p>Every document is already linked here.</p></div>'),
    '<button class="btn" onclick="closeModal()">Cancel</button>'+(avail.length?'<button class="btn primary" onclick="doLink(\''+kind+'\',\''+id+'\')">Link selected</button>':''),true);
};
window.doLink=async(kind,id)=>{
  const picks=[...document.querySelectorAll('.lchk')].filter(c=>c.checked).map(c=>c.value);
  if(!picks.length){toast('Pick at least one document','bad');return}
  busy(true,'Linking…');
  try{ DB=await api('linkDocs',[kind,id,picks]); busy(false); closeModal(); render(); toast(picks.length+' document(s) linked','ok'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.unlinkDoc=async(kind,id,docId)=>{
  if(!confirm('Unlink this document?\n\nThe file stays in the Drive folder.'))return;
  busy(true,'Unlinking…');
  try{ DB=await api('unlinkDoc',[kind,id,docId]); busy(false); render(); toast('Document unlinked (file kept in Drive)','ok'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.delDoc=async id=>{ const d=doc_(id);
  if(!confirm('Delete “'+d.title+'”?\n\nThe file will be moved to Drive trash and unlinked everywhere.'))return;
  busy(true,'Deleting…');
  try{ DB=await api('deleteDoc',[id]); busy(false); render(); toast(d.title,'ok','Document deleted'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.syncFolder=async()=>{ busy(true,'Scanning Drive folder…');
  try{ const b=DB.docs.length; DB=await api('syncFolder',[]); busy(false); render();
    const n=DB.docs.length-b; toast(n?(n+' new file(s) found'):'No new files','ok','Folder synced'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.openUpload=(kind,id)=>{
  modal('Upload Document'+(kind?' & attach':''),
    '<div class="f"><label>Title <span class="req">*</span></label><input id="u_title" placeholder="e.g. Gate Pass 700/1500 dtd. 01.08.2026"></div>'
    +'<div class="f" style="margin-top:10px"><label>Image file <span class="req">*</span></label><input id="u_file" type="file" accept="image/*"></div>'
    +'<div class="hint" style="margin-top:8px">Resized in your browser, then stored once in the Drive folder'+(kind?' and linked to this record':'')+'.</div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="uBtn" onclick="doUpload('+(kind?'\''+kind+'\',\''+id+'\'':'')+')">Upload</button>');
};
function resizeImg(file,max,q){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>{ const im=new Image();
      im.onload=()=>{ const sc=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas'); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',q).split(',')[1]); };
      im.onerror=rej; im.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file); });
}
window.doUpload=async(kind,id)=>{
  const t=$('#u_title').value.trim(), f=$('#u_file').files[0];
  if(!t){toast('Enter a title','bad');return}
  if(!f){toast('Choose an image','bad');return}
  $('#uBtn').disabled=true; busy(true,'Uploading to Drive…');
  try{ const full=await resizeImg(f,1600,.82), thumb=await resizeImg(f,240,.6);
    DB=await api('uploadDoc',[{title:t,name:f.name,mime:'image/jpeg',full:full,thumb:thumb,link:kind?{kind:kind,id:id}:null}]);
    busy(false); closeModal(); render(); toast(t+' stored in Drive'+(kind?' and attached':''),'ok','Upload complete'); }
  catch(e){ busy(false); const b=$('#uBtn'); if(b)b.disabled=false; toast(e.message,'bad','Upload failed'); } };

/* ---------- render / boot ---------- */
function render(){
  const P={home:pageHome,dash:pageDash,available:pageAvailable,low:pageLow,received:pageReceived,issued:pageIssued,register:pageRegister,
           ledger:pageLedger,documents:pageDocuments,admin:pageAdmin,item:pageItem,
           kits:pageKits,kitregister:pageKitRegister,kit:pageKit,users:pageUsers,kitdash:pageKitDash,reports:pageReports};
  if(S.page==='users' && !isAdmin()) S.page='home';
  $('#view').innerHTML=(P[S.page]||pageHome)();
  const vw=$('#view'); vw.classList.remove('view-enter'); void vw.offsetWidth; vw.classList.add('view-enter');
  document.querySelectorAll('[data-sec]').forEach(el=>el.classList.remove('no-print'));
  renderNav();
}

/* ---------- auth ---------- */
window.showAuthTab=t=>{
  $('#tabLoginBtn').classList.toggle('on',t==='login'); $('#tabRegBtn').classList.toggle('on',t==='reg');
  $('#authLogin').style.display=t==='login'?'':'none'; $('#authReg').style.display=t==='reg'?'':'none';
  $('#loginMsg').className='loginmsg'; $('#regMsg').className='loginmsg';
};
function authMsg(id,msg,kind){
  if(msg==='STALE_DEPLOYMENT') return;          // showStale() already rendered the full guidance
  const el=$(id); el.textContent=msg; el.className='loginmsg show '+(kind||'bad');
}
window.doLogin=async()=>{
  const u=$('#li_user').value.trim(), p=$('#li_pass').value;
  if(!u||!p){ authMsg('#loginMsg','Enter username and password'); return; }
  $('#loginBtn').disabled=true;
  try{
    const r=await api('login',[u,p]);
    TOKEN=r.token; ME={username:r.username,fullName:r.fullName,role:r.role};
    localStorage.setItem('karjat_token',TOKEN); localStorage.setItem('karjat_me',JSON.stringify(ME));
    $('#loginwrap').style.display='none'; $('#appRoot').style.display='';
    $('#loginMsg').className='loginmsg';
    boot(true);
  }catch(e){ authMsg('#loginMsg',e.message); }
  finally{ $('#loginBtn').disabled=false; }
};
window.doRegister=async()=>{
  const n=$('#rg_name').value.trim(), u=$('#rg_user').value.trim(), p=$('#rg_pass').value;
  if(!u||!p){ authMsg('#regMsg','Choose a username and password'); return; }
  $('#regBtn2').disabled=true;
  try{ await api('register',[u,p,n]);
    authMsg('#regMsg','Request submitted. An admin must approve your account before you can sign in.','ok');
    $('#rg_user').value=''; $('#rg_pass').value=''; $('#rg_name').value='';
  }catch(e){ authMsg('#regMsg',e.message); }
  finally{ $('#regBtn2').disabled=false; }
};
window.doLogout=(silent)=>{
  TOKEN=''; ME={username:'',fullName:'',role:'viewer'};
  localStorage.removeItem('karjat_token'); localStorage.removeItem('karjat_me');
  try{ sessionStorage.removeItem('karjat_db'); }catch(e){}
  USERS_CACHE=[]; DB={settings:{},uoms:[],ownerships:[],kitStatuses:[],moveReasons:[],categories:[],items:[],docs:[],kits:[],reports:[],serverDate:'',folderUrl:''};
  $('#appRoot').style.display='none'; $('#loginwrap').style.display='flex';
  $('#li_pass').value=''; $('#loginBtn').disabled=false;
  $('#loginMsg').className='loginmsg'; $('#regMsg').className='loginmsg';
  showAuthTab('login');
  if(!silent) toast('Signed out','ok');
};

async function boot(fresh,quiet){
  if(!quiet) busy(true,'Connecting to database…',true);
  try{
    const wantUsers=isAdmin();
    const [dbRes]=await Promise.all([api('getBootstrap'), wantUsers?loadUsers():Promise.resolve()]);
    DB=dbRes;
    try{ sessionStorage.setItem('karjat_db',JSON.stringify(DB)); }catch(e){}
    if(!quiet){ busy(false,'',true); }
    render(); renderBell();
    if(DB.version && DB.version!==FRONTEND_VERSION){
      toast('Backend is v'+DB.version+' but this page expects v'+FRONTEND_VERSION+'. Publish a New version in Apps Script.','warn','Version mismatch');
    }
    if(fresh) toast(DB.items.length+' materials · '+DB.kits.length+' kits · '+DB.docs.length+' documents','ok','Connected');
  }catch(e){
    if(quiet){ return; } // cached UI already shown — a background refresh failure is silent
    busy(false,'',true);
    if(/log in again/i.test(e.message)){ doLogout(true); return; }
    $('#view').innerHTML='<div class="card"><div class="empty"><h1 style="font-size:18px;color:var(--bad);margin-bottom:8px">Could not reach the database</h1>'
      +'<p class="mono" style="background:#fdeceb;padding:8px 12px;border-radius:6px;display:inline-block">'+esc(e.message)+'</p>'
      +'<ul style="text-align:left;max-width:540px;margin:14px auto;font-size:12.5px">'
      +'<li>Run <b>migrate()</b> once in the Apps Script editor (safe to re-run)</li>'
      +'<li>Deploy the web app with <b>Who has access: Anyone</b></li>'
      +'<li>After editing Code.gs, create a <b>New deployment</b> — saving alone does not update the live app</li></ul>'
      +'<button class="btn primary" onclick="boot(true)">Retry</button></div></div>'; renderNav();
  }
}
function init(){
  initLb();
  try{ history.replaceState({app:1},'',''); }catch(e){}
  window.addEventListener('popstate',()=>{
    if(S.hist && S.hist.length){ back(); try{ history.pushState({app:1},'',''); }catch(e){} }
  });
  $('#btnRefresh').onclick=async()=>{ busy(true,'Refreshing…'); try{ DB=await api('getBootstrap'); busy(false); render(); toast('Data reloaded','ok'); }catch(e){ busy(false); toast(e.message,'bad'); } };
  $('#btnLogout').onclick=()=>doLogout();
  $('#hamb').onclick=()=>{ $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); };
  $('#scrim').onclick=()=>{ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); };
  $('#bellBtn').onclick=e=>{ e.stopPropagation(); $('#bellPanel').classList.toggle('open'); renderBell(); };
  document.addEventListener('click',e=>{ if(!e.target.closest('.bellpanel')&&!e.target.closest('#bellBtn')) $('#bellPanel').classList.remove('open'); });
  $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
  let t; $('#q').addEventListener('input',e=>{ clearTimeout(t); t=setTimeout(()=>{ S.q=e.target.value.trim();
    if(S.q && ['available','issued','ledger','received'].indexOf(S.page)<0){ S.hist.push(snap()); S.page='available'; } render(); },200); });
  if(TOKEN && ME.username){
    $('#loginwrap').style.display='none'; $('#appRoot').style.display='';
    let cached=null; try{ cached=JSON.parse(sessionStorage.getItem('karjat_db')||'null'); }catch(e){}
    if(cached && cached.items){ DB=cached; render(); renderBell(); boot(false,true); } // instant from cache, quiet refresh
    else boot(true);
  }
  else { $('#loginwrap').style.display='flex'; $('#appRoot').style.display='none'; }
}
init();
</script>
