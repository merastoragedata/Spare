<!DOCTYPE html>
<html lang="en">
<head>

<title>Spare Material Register — 400 kV Karjat SS | MSETCL</title>
<style>
:root{
  --navy:#16294d; --navy2:#1F3864; --blue:#2E5496; --blue-l:#3f6cb5; --accent:#0e7c86;
  --ink:#16202e; --muted:#5d6b80; --line:#dde3ee; --bg:#eef1f6; --card:#fff;
  --ok:#1a7f45; --ok-bg:#e4f5ea; --warn:#9a6a00; --warn-bg:#fdf2d8; --bad:#b3261e; --bad-bg:#fdeceb;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 6px 20px rgba(16,32,64,.08); --radius:10px;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:linear-gradient(180deg,var(--navy),#0f1d38);color:#fff;flex:0 0 auto;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.brand{padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .b1{font-weight:800;font-size:13.5px;line-height:1.25}
.brand .b2{font-size:11px;opacity:.72;margin-top:3px}
.nav{padding:10px 8px;overflow-y:auto;flex:1}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:.9px;opacity:.5;padding:12px 10px 5px}
.nav button{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;color:#dbe4f5;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:1px;background:none;border:0;width:100%;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.active{background:var(--blue);color:#fff}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.18);border-radius:20px;padding:1px 7px;font-size:10.5px;font-weight:700}
.nav .badge.alert{background:#e5484d;color:#fff}
.side-foot{padding:10px;border-top:1px solid rgba(255,255,255,.12);font-size:10.5px;opacity:.6}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:#f7f9fc;outline:none}
.search input:focus{border-color:var(--blue);background:#fff}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.45}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.role{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.role button{padding:6px 11px;border:0;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.role button.on{background:var(--navy2);color:#fff}
.content{padding:18px;flex:1;max-width:1500px;width:100%}
.page-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
.page-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.page-head .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink);transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}

.btn.danger{color:var(--bad);border-color:#f3c9c6}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--blue);cursor:pointer;font-size:12.5px;font-weight:600;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:14px;font-weight:700}

.card-b{padding:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}

.kpi.ok::before{background:var(--ok)} .kpi.warn::before{background:var(--warn)} .kpi.accent::before{background:var(--accent)} .kpi.bad::before{background:var(--bad)}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:23px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.kpi .d{font-size:11px;color:var(--muted);margin-top:1px}
.kpi.clickable{cursor:pointer} .kpi.clickable:hover{border-color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#f5f7fb;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);white-space:nowrap}
tbody tr:hover{background:#f6f9ff}
tr.clickable{cursor:pointer}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}

.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.n{background:#e8eefb;color:var(--blue)} .tag.g{background:#eceff4;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;font-size:11px;background:#fff;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:0 0 auto}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.banner{border:1px solid #f0c9c6;background:linear-gradient(90deg,#fdeceb,#fff);border-left:4px solid var(--bad);border-radius:var(--radius);padding:12px 15px;margin-bottom:18px}
.banner h4{font-size:13px;color:var(--bad);margin-bottom:6px}
.banner ul{margin:0;padding-left:18px;font-size:12.5px}
.banner li{margin:2px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;font-weight:700;color:var(--muted)}
.f label .req{color:var(--bad)}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,84,150,.12)}
.f .hint{font-size:10.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.check input{width:auto;margin:0}
.check span{font-size:12.5px;font-weight:600}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 14px;background:#fff}
legend{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);padding:0 6px}
.modal{position:fixed;inset:0;background:rgba(12,20,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:18px;overflow-y:auto}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:12px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.modal-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:15px;font-weight:800}
.modal-h .x{margin-left:auto;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-b{padding:16px}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 15px;border:0;background:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:0}
.dl dt{padding:7px 12px 7px 0;font-size:11.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.dl dd{padding:7px 0;margin:0;font-size:13px;border-bottom:1px solid var(--line);word-break:break-word}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;background:#fff;transition:transform .2s}
.gal figure:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.gal img{width:100%;height:90px;object-fit:cover;display:block;background:#f0f2f6}
.gal figcaption{font-size:10px;padding:5px 6px;color:var(--muted);border-top:1px solid var(--line);line-height:1.3}
.lb{position:fixed;inset:0;background:rgba(8,11,18,.97);z-index:500;display:none;flex-direction:column}
.lb.open{display:flex}
.lb-t{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(18,24,38,.94);color:#fff;flex-wrap:wrap}
.lb-t .ti{flex:1;min-width:70px;font-size:12px;opacity:.9;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;text-decoration:none;display:inline-flex;gap:4px}
.lb-z{color:#fff;font-size:11px;min-width:36px;text-align:center;opacity:.75}
.lb-s{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;position:relative}
.lb-s img{max-width:94%;max-height:92%;transition:transform .12s;user-select:none;background:#fff}
.lb-load{position:absolute;color:#fff;font-size:13px;opacity:.8}
.toasts{position:fixed;bottom:16px;right:16px;z-index:600;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:340px}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}
.loader{position:fixed;inset:0;background:rgba(238,241,246,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:400}
.loader.hide{display:none}
.spin{width:34px;height:34px;border:3px solid #cfd9ea;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
.scrim.on{display:block}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none}
  .hamb{display:inline-flex}
  .content{padding:13px}
  .page-head h1{font-size:17px}
}
@media(max-width:560px){ .dl{grid-template-columns:1fr} .dl dt{border-bottom:0;padding-bottom:0} .dl dd{padding-top:2px} .top-right .role{display:none} }
@media print{
  .sidebar,.topbar,.no-print,.tabs,.toasts,.loader{display:none!important}
  body{background:#fff;font-size:11px}.app{display:block}.content{padding:0;max-width:100%}
  .card{border:1px solid #bbb;box-shadow:none;break-inside:avoid}
  .tw{overflow:visible}.tw table{min-width:0}
  th,.tag,.kpi::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-head{display:block!important;margin-bottom:12px;border-bottom:2px solid var(--navy);padding-bottom:8px}
}
.print-head{display:none} .print-head h2{font-size:15px} .print-head .m{font-size:10px;color:#444}
</style>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="b1">MSETCL — 400 kV Karjat SS</div><div class="b2">Spare Material Register</div></div>

  <div class="main">
    <div class="topbar">
      <button class="hamb" id="hamb"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="q" placeholder="Search material, serial no., category…" autocomplete="off">
      </div>
      <div class="top-right">
        <div class="role"><button id="roleEditor">Editor</button><button id="roleAdmin">Admin</button></div>
        <button class="btn sm" id="btnRefresh">Refresh</button>
      </div>

  </div>
</div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="lb" id="lb">
  <div class="lb-t">
    <button class="lbb" id="lbBack">&#8592; Back</button>
    <div class="ti" id="lbTitle"></div>
    <button class="lbb" id="lbOut">&minus;</button><span class="lb-z" id="lbZ">100%</span><button class="lbb" id="lbIn">+</button>
    <a class="lbb" id="lbDl" download>&#8595; Download</a>
    <button class="lbb" id="lbClose">&times; Close</button>

</div>

<div class="loader" id="loader"><div class="spin"></div><div id="loadMsg" style="font-size:13px;color:#5d6b80">Connecting to database…</div></div>

<script>
/* ==========================================================================
   PASTE YOUR APPS SCRIPT WEB APP URL HERE  (the .../exec one)
   ========================================================================== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzTIyx81m6AmwSjTPTIeHnJyhI_n5e5mYDev7_VSszOf2esp-AVCBtMuoCMEWEU-079Eg/exec';
/* ========================================================================== */

const USE_GS = (typeof google !== 'undefined' && google.script && google.script.run);
const NEEDS_URL = !USE_GS && WEB_APP_URL.indexOf('PASTE_YOUR') === 0;

function api(fn, args){
  args = args || [];
  if (USE_GS) return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e.message||e))).__api__(fn,args);
  });
  return fetch(WEB_APP_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({fn:fn, args:args})
  }).then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'Server error'); return j.data; });
}

/* ---------- state ---------- */
let DB={settings:{},categories:[],items:[],docs:[],serverDate:''};
const S={page:'dash',itemId:null,tab:'receipt',q:'',cat:null,regCat:null,role:'editor',lowOnly:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const fmtDate=d=>{ if(!d) return '—'; const p=String(d).split('-'); return p.length===3? p[2]+'.'+p[1]+'.'+p[0] : d; };
const fmtN=n=>{ n=Number(n||0); return n%1===0? String(n) : n.toFixed(2); };
const money=n=>{ n=Number(n||0); return n? '₹ '+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'; };
const money0=n=>'₹ '+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const cat=id=>DB.categories.find(c=>c.id===id)||{name:'—',fields:[]};
const item=id=>DB.items.find(i=>i.id===id);
const recvQty=i=>(i.receipts||[]).reduce((s,r)=>s+Number(r.qty||0),0);
const issQty=i=>(i.issues||[]).reduce((s,r)=>s+Number(r.qty||0),0);
const availQty=i=>recvQty(i)-issQty(i);
const recvVal=i=>(i.receipts||[]).reduce((s,r)=>s+Number(r.totalAmt||0),0);
const isAdmin=()=>S.role==='admin';
function lastAct(i){
  const ds=[...(i.receipts||[]).map(r=>r.date),...(i.issues||[]).map(r=>r.date)].filter(Boolean).sort();
  return ds.length? ds[ds.length-1] : String(i.createdAt||'').slice(0,10);
}
/* LOW STOCK — only items explicitly flagged are considered */
const isLow=i=>!!i.trackLow && availQty(i)<=Number(i.lowCutoff||0);
const lowItems=()=>DB.items.filter(isLow);
function stockTag(i){
  const a=availQty(i);
  if(isLow(i)) return '<span class="tag bad">Low — '+fmtN(a)+' ≤ '+fmtN(i.lowCutoff)+'</span>';
  if(a<=0) return '<span class="tag g">Nil stock</span>';
  return '<span class="tag ok">'+fmtN(a)+' available</span>';
}
function toast(m,k){ const d=document.createElement('div'); d.className='toast '+(k||''); d.textContent=m;
  $('#toasts').appendChild(d); setTimeout(()=>{d.style.transition='opacity .3s';d.style.opacity='0';setTimeout(()=>d.remove(),320)},3000); }
function busy(on,msg){ $('#loader').classList.toggle('hide',!on); if(msg) $('#loadMsg').textContent=msg; }

/* ---------- XLSX writer (client side) ---------- */
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
const enc=s=>new TextEncoder().encode(s);
function zip(files){
  const ch=[],cd=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  for(const f of files){
    const nm=enc(f.name),d=f.data,c=crc32(d);
    const lh=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)];
    ch.push(new Uint8Array(lh),nm,d);
    const e=[...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)];
    e.nm=nm; cd.push(e); off+=lh.length+nm.length+d.length;
  }
  const st=off,cp=[];
  for(const e of cd){ cp.push(new Uint8Array(e),e.nm); off+=e.length+e.nm.length; }
  const eo=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(cd.length),...u16(cd.length),...u32(off-st),...u32(st),...u16(0)]);
  const all=[...ch,...cp,eo]; let len=0; all.forEach(a=>len+=a.length);
  const out=new Uint8Array(len); let p=0; all.forEach(a=>{out.set(a,p);p+=a.length}); return out;
}
const xesc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colName=n=>{let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s};
function sheetXml(rows,w){
  let cols=w&&w.length?'<cols>'+w.map((x,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+x+'" customWidth="1"/>').join('')+'</cols>':'';
  let xml='';
  rows.forEach((row,ri)=>{ let c='';
    row.forEach((v,ci)=>{ if(v===null||v===undefined||v==='')return;
      const ref=colName(ci+1)+(ri+1), st=(ri===0)?' s="1"':(typeof v==='number'?' s="2"':' s="3"');

        : '<c r="'+ref+'" t="inlineStr"'+st+'><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>'; });
    xml+='<row r="'+(ri+1)+'">'+c+'</row>'; });
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+cols+'<sheetData>'+xml+'</sheetData></worksheet>';

  f.push({name:'xl/_rels/workbook.xml.rels',data:enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sh.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sh.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>')});
  f.push({name:'xl/styles.xml',data:enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Calibri"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF305496"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFB0B0B0"/></left><right style="thin"><color rgb="FFB0B0B0"/></right><top style="thin"><color rgb="FFB0B0B0"/></top><bottom style="thin"><color rgb="FFB0B0B0"/></bottom></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs></styleSheet>')});

function itemSheets(i){
  const c=cat(i.categoryId);
  const info=[['Field','Value'],['Item Name',i.name],['Category',c.name],['Unit',i.unit||''],['Store / Location',i.location||''],
    ['Low-stock alert',i.trackLow?'Yes':'No'],['Low-stock cut-off',i.trackLow?Number(i.lowCutoff||0):'—']];
  (c.fields||[]).forEach(f=>info.push([f.label,String((i.fields&&i.fields[f.key])||'')]));
  info.push(['Total Received',recvQty(i)],['Total Issued / Utilised',issQty(i)],['Balance Available',availQty(i)],['Total Receipt Value (Rs)',recvVal(i)]);
  if(i.remarks) info.push(['Remarks',i.remarks]);
  const rh=[['Date','Qty','Received From','Reference Type','Reference No.','Invoice No.','Vehicle','Unit Rate','Taxable Amt','GST %','Total Amt','Received By','Remarks']];
  (i.receipts||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(r=>rh.push([fmtDate(r.date),Number(r.qty||0),r.source||'',r.refType||'',r.refNo||'',r.invoiceNo||'',r.vehicle||'',Number(r.unitRate||0),Number(r.taxableAmt||0),Number(r.gstPct||0),Number(r.totalAmt||0),r.receivedBy||'',r.remarks||'']));
  const ih=[['Date','Qty','Purpose of Use','Issued To','Work / Details','Location / Bay','Authorised By','Remarks']];
  (i.issues||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(r=>ih.push([fmtDate(r.date),Number(r.qty||0),r.purpose||'',r.issuedTo||'',r.workDetails||'',r.location||'',r.authorisedBy||'',r.remarks||'']));
  return [{name:'Summary',rows:info,widths:[30,58]},
          {name:'Material Receipt',rows:rh,widths:[12,8,26,18,22,18,16,11,13,7,12,16,30]},
          {name:'Material Used',rows:ih,widths:[12,8,26,20,32,16,18,26]}];
}
function fullSheets(){
  const s1=[['Sr.','Item Name','Category','Unit','Received','Issued','Balance','Store / Location','Receipt Value (Rs)','Last Activity','Low Alert','Cut-off','Status']];
  DB.items.slice().sort((a,b)=>lastAct(b).localeCompare(lastAct(a))).forEach((i,n)=>{
    s1.push([n+1,i.name,cat(i.categoryId).name,i.unit||'',recvQty(i),issQty(i),availQty(i),i.location||'',recvVal(i),fmtDate(lastAct(i)),
      i.trackLow?'Yes':'No', i.trackLow?Number(i.lowCutoff||0):'', isLow(i)?'LOW STOCK':(availQty(i)<=0?'Nil stock':'Available')]);
  });
  const s2=[['Sr.','Item Name','Category','Date','Qty','Received From','Reference Type','Reference No.','Invoice No.','Vehicle','Unit Rate','Taxable Amt','GST %','Total Amt','Received By','Remarks']];
  let n=0; DB.items.forEach(i=>(i.receipts||[]).forEach(r=>{n++;s2.push([n,i.name,cat(i.categoryId).name,fmtDate(r.date),Number(r.qty||0),r.source||'',r.refType||'',r.refNo||'',r.invoiceNo||'',r.vehicle||'',Number(r.unitRate||0),Number(r.taxableAmt||0),Number(r.gstPct||0),Number(r.totalAmt||0),r.receivedBy||'',r.remarks||''])}));
  const s3=[['Sr.','Item Name','Category','Date','Qty','Purpose of Use','Issued To','Work / Details','Location / Bay','Authorised By','Remarks']];
  let m=0; DB.items.forEach(i=>(i.issues||[]).forEach(r=>{m++;s3.push([m,i.name,cat(i.categoryId).name,fmtDate(r.date),Number(r.qty||0),r.purpose||'',r.issuedTo||'',r.workDetails||'',r.location||'',r.authorisedBy||'',r.remarks||''])}));
  const s4=[['Category','Item Count','Total Received','Total Issued','Balance','Value (Rs)']];
  DB.categories.forEach(c=>{const t=DB.items.filter(i=>i.categoryId===c.id);
    s4.push([c.name,t.length,t.reduce((s,i)=>s+recvQty(i),0),t.reduce((s,i)=>s+issQty(i),0),t.reduce((s,i)=>s+availQty(i),0),t.reduce((s,i)=>s+recvVal(i),0)])});
  const s5=[['Sr.','Item Name','Category','Balance','Cut-off','Shortfall','Store / Location']];
  lowItems().forEach((i,k)=>s5.push([k+1,i.name,cat(i.categoryId).name,availQty(i),Number(i.lowCutoff||0),Math.max(0,Number(i.lowCutoff||0)-availQty(i)),i.location||'']));
  return [{name:'Stock Position',rows:s1,widths:[5,40,24,8,10,9,10,20,16,13,9,8,12]},
          {name:'Low Stock Alerts',rows:s5,widths:[5,40,24,10,9,10,22]},
          {name:'All Receipts',rows:s2,widths:[5,34,20,12,7,26,17,22,18,16,11,13,7,12,16,28]},
          {name:'All Issues',rows:s3,widths:[5,34,20,12,7,26,20,30,16,18,26]},
          {name:'Category Summary',rows:s4,widths:[30,11,14,13,10,16]}];
}

const LB={s:1,x:0,y:0,drag:false,sx:0,sy:0,d:null};
const lbApply=()=>{ $('#lbImg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')'; $('#lbZ').textContent=Math.round(LB.s*100)+'%'; };
function lbShow(src,title){
  $('#lbImg').src=src; $('#lbTitle').textContent=title||''; $('#lbLoad').style.display='none';
  $('#lbDl').href=src; $('#lbDl').setAttribute('download',(title||'document').toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,60)+'.jpg');
  LB.s=1;LB.x=0;LB.y=0;lbApply();
}
window.openDoc=async(docId)=>{
  const d=DB.docs.find(x=>x.id===docId); if(!d){toast('Document not found','bad');return}
  $('#lb').classList.add('open'); document.body.style.overflow='hidden';
  $('#lbTitle').textContent=d.title||''; $('#lbImg').src=d.thumb||''; $('#lbLoad').style.display='block'; $('#lbLoad').textContent='Loading full image…';
  try{ const full=await api('getDocFull',[docId]); lbShow(full,d.title); }
  catch(e){ $('#lbLoad').textContent='Could not load: '+e.message; }
};
function lbClose(){ $('#lb').classList.remove('open'); $('#lbImg').src=''; document.body.style.overflow=''; }
function initLb(){
  $('#lbClose').onclick=lbClose; $('#lbBack').onclick=lbClose;
  $('#lbIn').onclick=()=>{LB.s=Math.min(LB.s*1.35,6);lbApply()};
  $('#lbOut').onclick=()=>{LB.s=Math.max(LB.s/1.35,.4);lbApply()};
  $('#lb').addEventListener('click',e=>{ if(e.target.id==='lb'||e.target.id==='lbStage') lbClose(); });
  document.addEventListener('keydown',e=>{ if(!$('#lb').classList.contains('open'))return;
    if(e.key==='Escape')lbClose(); if(e.key==='+'||e.key==='=')$('#lbIn').click(); if(e.key==='-')$('#lbOut').click(); });
  const st=$('#lbStage');
  st.addEventListener('wheel',e=>{e.preventDefault();LB.s=Math.min(Math.max(LB.s*(e.deltaY<0?1.15:1/1.15),.4),6);lbApply()},{passive:false});
  st.addEventListener('mousedown',e=>{ if(e.target.id!=='lbImg')return; LB.drag=true;LB.sx=e.clientX-LB.x;LB.sy=e.clientY-LB.y;e.preventDefault(); });
  addEventListener('mousemove',e=>{ if(LB.drag){LB.x=e.clientX-LB.sx;LB.y=e.clientY-LB.sy;lbApply()} });
  addEventListener('mouseup',()=>LB.drag=false);
  st.addEventListener('touchstart',e=>{ if(e.touches.length===1){LB.drag=true;LB.sx=e.touches[0].clientX-LB.x;LB.sy=e.touches[0].clientY-LB.y}
    else if(e.touches.length===2){LB.d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)} },{passive:true});
  st.addEventListener('touchmove',e=>{ if(e.touches.length===1&&LB.drag){LB.x=e.touches[0].clientX-LB.sx;LB.y=e.touches[0].clientY-LB.sy;lbApply()}
    else if(e.touches.length===2&&LB.d){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);LB.s=Math.min(Math.max(LB.s*(d/LB.d),.4),6);LB.d=d;lbApply()} },{passive:true});
  st.addEventListener('touchend',()=>{LB.drag=false;LB.d=null});
  $('#lbImg').addEventListener('dblclick',()=>{ if(LB.s>1){LB.s=1;LB.x=0;LB.y=0}else LB.s=2.2; lbApply(); });
}

function fieldInput(f,val){
  const v=val==null?'':val;
  let inp;

window.calcAmt=(taxTouched)=>{
  const q=Number($('#r_qty').value||0),r=Number($('#r_rate').value||0),g=Number($('#r_gst').value||0);
  const t=$('#r_tax'), tot=$('#r_total');
  if(taxTouched) t.dataset.touched='1';
  if(r&&q&&!t.dataset.touched) t.value=+(r*q).toFixed(2);
  const tv=Number(t.value||0);
  if(tv&&!tot.dataset.touched) tot.value=+(tv*(1+g/100)).toFixed(2);
};

function resizeImg(file,max,q){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image();
      im.onload=()=>{ const sc=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas'); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',q).split(',')[1]); };
      im.onerror=rej; im.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
window.doUpload=async()=>{
  const t=$('#u_title').value.trim(), f=$('#u_file').files[0];
  if(!t){toast('Enter a title','bad');return}
  if(!f){toast('Choose an image','bad');return}
  $('#uBtn').disabled=true; busy(true,'Uploading to Google Drive…');
  try{
    const full=await resizeImg(f,1600,.82), thumb=await resizeImg(f,240,.6);
    await api('uploadDoc',[{title:t,name:f.name,mime:'image/jpeg',full:full,thumb:thumb}]);
    DB=await api('getBootstrap');
    busy(false); closeModal(); render(); toast('Document uploaded','ok');
  }catch(e){ busy(false); const b=$('#uBtn'); if(b)b.disabled=false; toast(e.message,'bad'); }
};

      +'<p>Open <b>index.html</b> and paste your Apps Script deployment URL into:</p>'
      +'<p class="mono" style="background:#f5f7fb;padding:8px 12px;border-radius:6px;display:inline-block;margin-top:6px">const WEB_APP_URL = \'https://script.google.com/macros/s/.../exec\';</p>'
      +'<p style="margin-top:12px">Deploy with <b>Execute as: Me</b> and <b>Who has access: Anyone</b>.</p></div></div>';
    return;
  }
  busy(true,'Connecting to database…');
  try{
    DB=await api('getBootstrap');
    busy(false); setRole(S.role); render();
  }catch(e){
    busy(false);
    $('#view').innerHTML='<div class="card"><div class="empty"><h1 style="font-size:18px;color:var(--bad);margin-bottom:8px">Could not reach the database</h1>'
      +'<p class="mono" style="background:#fdeceb;padding:8px 12px;border-radius:6px;display:inline-block">'+esc(e.message)+'</p>'
      +'<p style="margin-top:14px;text-align:left;max-width:520px;margin-left:auto;margin-right:auto">Check that:</p>'
      +'<ul style="text-align:left;max-width:520px;margin:6px auto;font-size:12.5px">'
      +'<li>You ran <b>setupDatabase()</b> once in the Apps Script editor</li>'
      +'<li>The web app is deployed with <b>Who has access: Anyone</b></li>'
      +'<li><b>WEB_APP_URL</b> in index.html is the <b>/exec</b> URL of the latest deployment</li>'
      +'<li>After changing Code.gs you created a <b>New deployment</b> (or updated the existing one)</li></ul>'
      +'<p style="margin-top:10px"><button class="btn primary" onclick="boot()">Retry</button></p></div></div>';
    renderNav();
  }
}
function init(){
  initLb();
  $('#roleAdmin').onclick=()=>setRole('admin'); $('#roleEditor').onclick=()=>setRole('editor');
  $('#btnRefresh').onclick=async()=>{ busy(true,'Refreshing…'); try{ DB=await api('getBootstrap'); busy(false); render(); toast('Refreshed','ok'); }catch(e){ busy(false); toast(e.message,'bad'); } };
  $('#hamb').onclick=()=>{ $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); };
  $('#scrim').onclick=()=>{ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); };
  $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
  let t; $('#q').addEventListener('input',e=>{ clearTimeout(t); t=setTimeout(()=>{ S.q=e.target.value.trim();
    if(S.q && !['available','issued','ledger'].includes(S.page)) S.page='available';
    render(); },200); });
  setRole('editor'); boot();
}
init();
</script>
