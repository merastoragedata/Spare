<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spare Material Register — 400 kV Karjat SS | MSETCL</title>
<style>
:root{
  --navy:#16294d; --navy2:#1F3864; --blue:#2E5496; --blue-l:#3f6cb5; --accent:#0e7c86;
  --ink:#16202e; --muted:#5d6b80; --line:#dde3ee; --bg:#eef1f6; --card:#fff;
  --ok:#1a7f45; --ok-bg:#e4f5ea; --warn:#9a6a00; --warn-bg:#fdf2d8; --bad:#b3261e; --bad-bg:#fdeceb;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 6px 20px rgba(16,32,64,.08); --radius:10px;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
.app{display:flex;min-height:100vh}
.sidebar{width:238px;background:linear-gradient(180deg,var(--navy),#0f1d38);color:#fff;flex:0 0 auto;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.brand{padding:15px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .b1{font-weight:800;font-size:13.5px;line-height:1.25}
.brand .b2{font-size:11px;opacity:.72;margin-top:3px}
.nav{padding:9px 8px;overflow-y:auto;flex:1}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:.9px;opacity:.5;padding:11px 10px 5px}
.nav button{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;color:#dbe4f5;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:1px;background:none;border:0;width:100%;text-align:left}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.active{background:var(--blue);color:#fff}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.18);border-radius:20px;padding:1px 7px;font-size:10.5px;font-weight:700}
.nav .badge.alert{background:#e5484d}
.side-foot{padding:9px 10px;border-top:1px solid rgba(255,255,255,.12);font-size:10.5px;opacity:.65}
.side-foot a{color:#a8c4f5}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:#f7f9fc;outline:none}
.search input:focus{border-color:var(--blue);background:#fff}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.45}
.top-right{margin-left:auto;display:flex;align-items:center;gap:7px}
.role{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.role button{padding:6px 11px;border:0;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.role button.on{background:var(--navy2);color:#fff}
.content{padding:16px;flex:1;max-width:1500px;width:100%}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.crumb button{background:none;border:0;color:var(--blue);cursor:pointer;font-size:12px;font-weight:600;padding:0}
.crumb .sep{opacity:.5}
.page-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
.page-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.page-head .spacer{flex:1}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-l);color:#fff}
.btn.danger{color:var(--bad);border-color:#f3c9c6}
.btn.danger:hover{background:var(--bad-bg)}
.btn.warn{color:var(--warn);border-color:#e9d19a}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btn.xs{padding:3px 7px;font-size:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.back{background:#f2f5fa}
.link{background:none;border:0;color:var(--blue);cursor:pointer;font-size:12.5px;font-weight:600;padding:0;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card-h h3{font-size:14px;font-weight:700}
.card-h .spacer{flex:1}
.card-b{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.kpi.ok::before{background:var(--ok)} .kpi.warn::before{background:var(--warn)} .kpi.accent::before{background:var(--accent)} .kpi.bad::before{background:var(--bad)}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
.kpi .d{font-size:11px;color:var(--muted);margin-top:1px}
.kpi.clickable{cursor:pointer} .kpi.clickable:hover{border-color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#f5f7fb;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);white-space:nowrap}
tbody tr:hover{background:#f6f9ff}
tr.clickable{cursor:pointer}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{min-width:620px}
.tw::-webkit-scrollbar{height:8px}
.tw::-webkit-scrollbar-thumb{background:#c5d0e4;border-radius:4px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.n{background:#e8eefb;color:var(--blue)} .tag.g{background:#eceff4;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;font-size:11px;background:#fff;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:0 0 auto}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.banner{border:1px solid #f0c9c6;background:linear-gradient(90deg,#fdeceb,#fff);border-left:4px solid var(--bad);border-radius:var(--radius);padding:11px 14px;margin-bottom:16px}
.banner h4{font-size:13px;color:var(--bad);margin-bottom:5px}
.banner ul{margin:0;padding-left:18px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;font-weight:700;color:var(--muted)}
.f label .req{color:var(--bad)}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,84,150,.12)}
.f .hint{font-size:10.5px;color:var(--muted)}
.other-row{display:flex;gap:6px;align-items:center;margin-top:5px}
.other-row input{flex:1}
.check{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.check input{width:auto;margin:0} .check span{font-size:12.5px;font-weight:600}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 14px;background:#fff}
legend{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);padding:0 6px}
.modal{position:fixed;inset:0;background:rgba(12,20,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:16px;overflow-y:auto}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:12px;max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.modal-h{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:15px;font-weight:800}
.modal-h .x{margin-left:auto;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-b{padding:15px}
.modal-f{padding:11px 15px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;border:0;background:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:20px;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--muted)}
.subtabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dl{display:grid;grid-template-columns:auto 1fr;gap:0}
.dl dt{padding:7px 12px 7px 0;font-size:11.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.dl dd{padding:7px 0;margin:0;font-size:13px;border-bottom:1px solid var(--line);word-break:break-word}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.gal figure:hover{box-shadow:var(--shadow)}
.gal .imgwrap{cursor:zoom-in;position:relative}
.gal img{width:100%;height:92px;object-fit:cover;display:block;background:#f0f2f6}
.gal figcaption{font-size:10px;padding:5px 6px;color:var(--muted);border-top:1px solid var(--line);line-height:1.3}
.gal .drow{display:flex;gap:4px;padding:5px 6px;border-top:1px solid var(--line);background:#fafbfd}
.gal .drow a,.gal .drow button{font-size:10px;padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);text-decoration:none;flex:1;text-align:center}
.gal .drow a:hover,.gal .drow button:hover{border-color:var(--blue);color:var(--blue)}
.lb{position:fixed;inset:0;background:rgba(8,11,18,.97);z-index:500;display:none;flex-direction:column}
.lb.open{display:flex}
.lb-t{display:flex;align-items:center;gap:7px;padding:8px 11px;background:rgba(18,24,38,.94);color:#fff;flex-wrap:wrap}
.lb-t .ti{flex:1;min-width:70px;font-size:12px;opacity:.9;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;text-decoration:none}
.lb-z{color:#fff;font-size:11px;min-width:36px;text-align:center;opacity:.75}
.lb-s{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;position:relative}
.lb-s img{max-width:94%;max-height:92%;transition:transform .12s;user-select:none;background:#fff}
.lb-load{position:absolute;color:#fff;font-size:13px;opacity:.85}
.toasts{position:fixed;bottom:16px;right:16px;z-index:600;display:flex;flex-direction:column;gap:8px;max-width:min(360px,90vw)}
.toast{background:#fff;border-left:4px solid var(--blue);color:var(--ink);padding:10px 12px;border-radius:8px;font-size:12.5px;box-shadow:0 10px 30px rgba(16,32,64,.22);display:flex;gap:9px;align-items:flex-start;animation:tin .22s ease-out;overflow:hidden;max-height:120px}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
.toast .ic{font-weight:800;font-size:13px;line-height:1.3}
.toast.ok .ic{color:var(--ok)} .toast.bad .ic{color:var(--bad)} .toast.warn .ic{color:var(--warn)} .toast .ic{color:var(--blue)}
.toast .tx{flex:1} .toast .tt{font-weight:700;margin-bottom:1px}
.toast .cl{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0}
@keyframes tin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.loader{position:fixed;inset:0;background:rgba(238,241,246,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:11px;z-index:400}
.loader.hide{display:none}
.spin{width:32px;height:32px;border:3px solid #cfd9ea;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
.scrim.on{display:block}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none}
  .hamb{display:inline-flex}
  .content{padding:12px}
  .page-head h1{font-size:17px}
  .kpi .v{font-size:19px}
}
@media(max-width:560px){
  .dl{grid-template-columns:1fr}
  .dl dt{border-bottom:0;padding-bottom:0}
  .dl dd{padding-top:2px}
  .top-right .role{display:none}
  .acts .btn{flex:1 1 auto;justify-content:center;white-space:normal}
  .who{max-width:120px;overflow:hidden}
  .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media print{
  .sidebar,.topbar,.no-print,.tabs,.subtabs,.toasts,.loader,.crumb{display:none!important}
  body{background:#fff;font-size:11px}.app{display:block}.content{padding:0;max-width:100%}
  .card{border:1px solid #bbb;box-shadow:none;break-inside:avoid;margin-bottom:8px}
  .tw{overflow:visible}.tw table{min-width:0}
  th,.tag,.kpi::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-head{display:block!important;margin-bottom:12px;border-bottom:2px solid var(--navy);padding-bottom:8px}
  .gal img{height:auto}
}
.print-head{display:none} .print-head h2{font-size:15px} .print-head .m{font-size:10px;color:#444}

/* Login screen */
.loginwrap{position:fixed;inset:0;background:linear-gradient(160deg,#0f1d38,#16294d 55%,#1F3864);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.loginbox{background:#fff;border-radius:14px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.loginbox .lhead{background:var(--navy);color:#fff;padding:20px 22px;text-align:center}
.loginbox .lhead .t1{font-weight:800;font-size:15px}
.loginbox .lhead .t2{font-size:11.5px;opacity:.75;margin-top:3px}
.loginbox .lbody{padding:20px 22px}
.logintabs{display:flex;border-bottom:1px solid var(--line);margin:-20px -22px 16px}
.loginbox .lbody>div{display:block}
.logintabs button{flex:1;padding:11px;border:0;background:#f7f9fc;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
.logintabs button.on{background:#fff;color:var(--blue);border-bottom-color:var(--blue)}
.loginmsg{font-size:11.5px;padding:8px 10px;border-radius:7px;margin-bottom:10px;display:none}
.loginmsg.show{display:block}
.loginmsg.bad{background:var(--bad-bg);color:var(--bad)}
.loginmsg.ok{background:var(--ok-bg);color:var(--ok)}
/* Notification bell */
.bell{position:relative;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.bell .bcount{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:20px;font-size:9.5px;font-weight:800;padding:1px 5px;min-width:15px;text-align:center;line-height:1.3}
.bellpanel{position:absolute;top:44px;right:14px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(16,32,64,.22);width:320px;max-width:88vw;z-index:250;display:none;overflow:hidden}
.bellpanel.open{display:block}
.bellpanel .bp-h{padding:10px 13px;border-bottom:1px solid var(--line);font-weight:800;font-size:12.5px;display:flex;align-items:center}
.bellpanel .bp-list{max-height:340px;overflow-y:auto}
.bellpanel .bp-item{padding:9px 13px;border-bottom:1px solid var(--line);font-size:12px}
.bellpanel .bp-item:last-child{border-bottom:0}
.bellpanel .bp-item .tt{font-weight:700;display:flex;align-items:center;gap:5px}
.bellpanel .bp-item .tm{font-size:10px;color:var(--muted);margin-top:2px}
.bellpanel .bp-empty{padding:22px;text-align:center;color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.who b{font-weight:700}
.rolepill{padding:1px 7px;border-radius:20px;font-size:9.5px;font-weight:800;text-transform:uppercase}
.rolepill.admin{background:#e8eefb;color:var(--blue)}
.rolepill.editor{background:var(--ok-bg);color:var(--ok)}
.rolepill.viewer{background:#eceff4;color:var(--muted)}
/* status banner (kits) */
.statusbanner{border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.statusbanner.ok{background:linear-gradient(90deg,#1a7f45,#2a9d5c)}
.statusbanner.warn{background:linear-gradient(90deg,#9a6a00,#c98f1f)}
.statusbanner.bad{background:linear-gradient(90deg,#b3261e,#d94c3f)}
.statusbanner .sb-t{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.statusbanner .sb-v{font-size:16px;font-weight:800;margin-top:2px}
.healthpill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800}
.healthpill.Healthy{background:var(--ok-bg);color:var(--ok)}
.healthpill.Faulty{background:var(--bad-bg);color:var(--bad)}
.healthpill.sev{background:var(--bad-bg);color:var(--bad)}
.healthpill.minor{background:var(--warn-bg);color:var(--warn)}
.issuelist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.issuerow{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.issuerow input[type=text]{flex:1}
.issuerow .rez{display:flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap}
.pick-list{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.pick-row{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:12.5px}
.pick-row:last-child{border-bottom:0}
.pick-row input{width:auto}
.exportstep{display:none}
.exportstep.on{display:block}
</style>
</head>
<body>
<div class="loginwrap" id="loginwrap">
  <div class="loginbox">
    <div class="lhead"><div class="t1">MSETCL — 400 kV Karjat SS</div><div class="t2">Spare Material &amp; Test Kit Register</div></div>
    <div class="lbody">
      <div class="logintabs"><button id="tabLoginBtn" class="on" onclick="showAuthTab('login')">Sign In</button><button id="tabRegBtn" onclick="showAuthTab('reg')">Register</button></div>
      <div id="authLogin">
        <div class="loginmsg" id="loginMsg"></div>
        <div class="f" style="margin-bottom:10px"><label>Username</label><input id="li_user" autocomplete="username" placeholder="admin"></div>
        <div class="f" style="margin-bottom:14px"><label>Password</label><input id="li_pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <button class="btn primary" style="width:100%;justify-content:center" id="loginBtn" onclick="doLogin()">Sign In</button>

const LB={s:1,x:0,y:0,drag:false,sx:0,sy:0,d:null};
const lbApply=()=>{ $('#lbImg').style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')'; $('#lbZ').textContent=Math.round(LB.s*100)+'%'; };
window.openDoc=async(id)=>{

  $('#lbDrive').href=d.url;
  LB.s=1;LB.x=0;LB.y=0;lbApply();
  try{ const full=await api('getDocFull',[id]);
    $('#lbImg').src=full; $('#lbLoad').style.display='none';
    $('#lbDl').href=full; $('#lbDl').setAttribute('download',(d.title||'document').toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,60)+'.jpg');
  }catch(e){ $('#lbLoad').textContent='Could not load: '+e.message; }

function lbClose(){ $('#lb').classList.remove('open'); $('#lbImg').src=''; document.body.style.overflow=''; }
function initLb(){
  $('#lbClose').onclick=lbClose; $('#lbBack').onclick=lbClose;
  $('#lbIn').onclick=()=>{LB.s=Math.min(LB.s*1.35,6);lbApply()};
  $('#lbOut').onclick=()=>{LB.s=Math.max(LB.s/1.35,.4);lbApply()};
  $('#lb').addEventListener('click',e=>{ if(e.target.id==='lb'||e.target.id==='lbStage') lbClose(); });
  document.addEventListener('keydown',e=>{ if(!$('#lb').classList.contains('open'))return;
    if(e.key==='Escape')lbClose(); if(e.key==='+'||e.key==='=')$('#lbIn').click(); if(e.key==='-')$('#lbOut').click(); });
  const st=$('#lbStage');
  st.addEventListener('wheel',e=>{e.preventDefault();LB.s=Math.min(Math.max(LB.s*(e.deltaY<0?1.15:1/1.15),.4),6);lbApply()},{passive:false});
  st.addEventListener('mousedown',e=>{ if(e.target.id!=='lbImg')return; LB.drag=true;LB.sx=e.clientX-LB.x;LB.sy=e.clientY-LB.y;e.preventDefault(); });
  addEventListener('mousemove',e=>{ if(LB.drag){LB.x=e.clientX-LB.sx;LB.y=e.clientY-LB.sy;lbApply()} });
  addEventListener('mouseup',()=>LB.drag=false);
  st.addEventListener('touchstart',e=>{ if(e.touches.length===1){LB.drag=true;LB.sx=e.touches[0].clientX-LB.x;LB.sy=e.touches[0].clientY-LB.y}
    else if(e.touches.length===2){LB.d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)} },{passive:true});
  st.addEventListener('touchmove',e=>{ if(e.touches.length===1&&LB.drag){LB.x=e.touches[0].clientX-LB.sx;LB.y=e.touches[0].clientY-LB.sy;lbApply()}
    else if(e.touches.length===2&&LB.d){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);LB.s=Math.min(Math.max(LB.s*(d/LB.d),.4),6);LB.d=d;lbApply()} },{passive:true});
  st.addEventListener('touchend',()=>{LB.drag=false;LB.d=null});
  $('#lbImg').addEventListener('dblclick',()=>{ if(LB.s>1){LB.s=1;LB.x=0;LB.y=0}else LB.s=2.2; lbApply(); });
}

/* ---------- smart inputs (dropdown + Other…) ---------- */
const OTHER='__other__';
function selectWithOther(id,options,value,ph){
  const opts=(options||[]).slice();
  const isOther = value && opts.indexOf(value)<0;
  return '<select id="'+id+'" onchange="onOther(\''+id+'\')">'
    +'<option value="">— select —</option>'
    +opts.map(o=>'<option'+(o===value?' selected':'')+'>'+esc(o)+'</option>').join('')
    +'<option value="'+OTHER+'"'+(isOther?' selected':'')+'>➕ Other…</option></select>'
    +'<div class="other-row" id="'+id+'_row" style="display:'+(isOther?'flex':'none')+'">'
    +'<input id="'+id+'_o" value="'+esc(isOther?value:'')+'" placeholder="'+esc(ph||'Type the new value')+'">'
    +'<button type="button" class="btn xs" onclick="cancelOther(\''+id+'\')">List</button></div>';
}
window.onOther=id=>{ const s=document.getElementById(id), r=document.getElementById(id+'_row');
  if(!r) return; const on=s.value===OTHER; r.style.display=on?'flex':'none'; if(on) document.getElementById(id+'_o').focus(); };
window.cancelOther=id=>{ const s=document.getElementById(id); s.value=''; document.getElementById(id+'_row').style.display='none'; document.getElementById(id+'_o').value=''; };
function readSel(id){ const s=document.getElementById(id); if(!s) return '';
  if(s.value===OTHER){ const o=document.getElementById(id+'_o'); return o?o.value.trim():''; } return s.value; }
function isOtherUsed(id){ const s=document.getElementById(id); return s && s.value===OTHER && readSel(id); }

function fieldInput(f,val){
  const v=val==null?'':val, id='cf_'+f.key;
  let inp;
  if(f.type==='select') inp=selectWithOther(id,f.options,v,'Type a new '+f.label.toLowerCase());
  else if(f.type==='textarea') inp='<textarea id="'+id+'" rows="2">'+esc(v)+'</textarea>';
  else if(f.type==='number') inp='<input id="'+id+'" type="number" step="any" value="'+esc(v)+'">';
  else if(f.type==='date') inp='<input id="'+id+'" type="date" value="'+esc(v)+'">';
  else inp='<input id="'+id+'" value="'+esc(v)+'"'+(f.hint?' placeholder="'+esc(f.hint)+'"':'')+'>';
  return '<div class="f"><label>'+esc(f.label)+(f.required?' <span class="req">*</span>':'')+'</label>'+inp
    +(f.hint&&f.type!=='text'?'<div class="hint">'+esc(f.hint)+'</div>':'')+'</div>';
}
function readFields(c){
  const out={}, promos=[];
  (c.fields||[]).forEach(f=>{
    const id='cf_'+f.key;
    let v;
    if(f.type==='select'){ v=readSel(id); if(isOtherUsed(id) && (f.options||[]).indexOf(v)<0 && v) promos.push({kind:'field',catId:c.id,key:f.key,label:f.label,value:v}); }
    else { const el=document.getElementById(id); v=el?el.value.trim():''; }
    if(v) out[f.key]=v;
  });
  return {values:out,promos:promos};
}

    +promos.map((p,n)=>'<label class="check" style="margin-bottom:7px"><input type="checkbox" class="promo" data-n="'+n+'" checked>'
      +'<span><b>'+esc(p.value)+'</b> <span style="color:var(--muted);font-weight:500">→ '+esc(p.kind==='uom'?'Unit of Measure list':p.label+' dropdown')+'</span></span></label>').join(''),
    '<button class="btn" onclick="closeModal()">Not now</button><button class="btn primary" onclick="applyPromos()">Add selected</button>');

window.applyPromos=async()=>{
  const picks=[...document.querySelectorAll('.promo')].filter(c=>c.checked).map(c=>window.__promos[+c.dataset.n]);
  closeModal();
  if(!picks.length) return;
  busy(true,'Adding option'+(picks.length>1?'s':'')+'…');
  try{
    for(const p of picks){
      if(p.kind==='uom') DB=await api('addUom',[p.value]);
      else DB=await api('addFieldOption',[p.catId,p.key,p.value]);
      toast('“'+p.value+'” added to '+(p.kind==='uom'?'Unit of Measure list':p.label+' dropdown'),'ok','Dropdown updated');
    }
    busy(false); render();
  }catch(e){ busy(false); toast(e.message,'bad'); }
};

/** Documents tab: one sub-tab per consignment + item-level, brief data then attachments. */
function tabDocs(i){
  const groups=[{key:'all',label:'All ('+itemDocs(i).length+')'}];
  (i.receipts||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach((r,n)=>
    groups.push({key:'r'+r.id,label:'Receipt '+(n+1)+' · '+fmtDate(r.date)}));
  (i.issues||[]).forEach((r,n)=>groups.push({key:'i'+r.id,label:'Issue '+(n+1)+' · '+fmtDate(r.date)}));
  groups.push({key:'item',label:'Material-level'});
  if(!groups.some(g=>g.key===S.doctab)) S.doctab='all';
  let brief='', docs=[], unlinkKind=null, unlinkId=null;
  if(S.doctab==='all'){ docs=itemDocs(i);
    brief='<dl class="dl">'+row('Material',i.name)+row('Category',cat(i.categoryId).name)+row('Documents',docs.length+' file(s) linked')+'</dl>'; }
  else if(S.doctab==='item'){ docs=(i.docs||[]).filter(d=>doc_(d)); unlinkKind='item'; unlinkId=i.id;
    brief='<dl class="dl">'+row('Scope','Documents attached to the material itself (nameplates, manuals, test reports)')+'</dl>'; }
  else if(S.doctab[0]==='r'){ const r=(i.receipts||[]).find(x=>'r'+x.id===S.doctab);
    if(r){ docs=(r.docs||[]).filter(d=>doc_(d)); unlinkKind='receipt'; unlinkId=r.id;
      brief='<dl class="dl">'+row('Date of Receipt',fmtDate(r.date))+row('Quantity',fmtN(r.qty)+' '+(i.unit||''))+row('Received From',r.source)
        +row('Reference',[r.refType,r.refNo].filter(Boolean).join(' '))+row('Invoice No.',r.invoiceNo)+row('Vehicle / LR',r.vehicle)
        +(r.totalAmt?row('Total Amount',money(r.totalAmt)):'')+row('Received By',r.receivedBy)+row('Remarks',r.remarks)+'</dl>'; } }
  else { const r=(i.issues||[]).find(x=>'i'+x.id===S.doctab);
    if(r){ docs=(r.docs||[]).filter(d=>doc_(d)); unlinkKind='issue'; unlinkId=r.id;
      brief='<dl class="dl">'+row('Date of Issue',fmtDate(r.date))+row('Quantity',fmtN(r.qty)+' '+(i.unit||''))+row('Purpose',r.purpose)
        +row('Issued To',r.issuedTo)+row('Work / Details',r.workDetails)+row('Authorised By',r.authorisedBy)+'</dl>'; } }
  return '<div class="subtabs no-print">'+groups.map(g=>'<button class="'+(S.doctab===g.key?'on':'')+'" onclick="setDocTab(\''+g.key+'\')">'+esc(g.label)+'</button>').join('')+'</div>'
  +'<div class="card" data-sec="sec-docs" style="margin-bottom:12px"><div class="card-h"><h3>Details</h3></div><div class="card-b">'+(brief||'<div class="empty"><p>—</p></div>')+'</div></div>'
  +'<div class="card" data-sec="sec-docs"><div class="card-h"><h3>Attachments</h3><span class="tag g">'+docs.length+'</span><div class="spacer"></div>'
  +(unlinkKind?'<button class="btn sm no-print" onclick="openLink(\''+unlinkKind+'\',\''+unlinkId+'\')">Link existing</button> <button class="btn sm primary no-print" onclick="openUpload(\''+unlinkKind+'\',\''+unlinkId+'\')">+ Upload</button>':'')
  +'</div><div class="card-b">'
  +(docs.length?'<div class="gal">'+docs.map(d=>docCard(doc_(d),null,unlinkKind?'unlinkDoc(\''+unlinkKind+'\',\''+unlinkId+'\',\''+d+'\')':null)).join('')+'</div>'
    :'<div class="empty"><p>No documents in this group.</p>'+(unlinkKind?'<p class="no-print"><button class="btn sm" onclick="openLink(\''+unlinkKind+'\',\''+unlinkId+'\')">Link existing document</button></p>':'')+'</div>')
  +'</div></div>';
}

window.setRegCat=v=>{S.regCat=v;render()};
window.toggleLow=()=>{ const on=$('#r_tracklow').checked; $('#lowWrap').style.display=on?'':'none'; if(on)$('#r_lowcut').focus(); };
window.calcAmt=(t)=>{ const q=Number($('#r_qty').value||0),r=Number($('#r_rate').value||0),g=Number($('#r_gst').value||0);
  const tx=$('#r_tax'),tot=$('#r_total'); if(t)tx.dataset.touched='1';
  if(r&&q&&!tx.dataset.touched) tx.value=+(r*q).toFixed(2);
  const tv=Number(tx.value||0); if(tv&&!tot.dataset.touched) tot.value=+(tv*(1+g/100)).toFixed(2); };
window.submitReg=async e=>{
  e.preventDefault();
  const c=cat(S.regCat||DB.categories[0].id);
  const fr=readFields(c);
  const miss=(c.fields||[]).filter(f=>f.required&&!fr.values[f.key]);
  if(miss.length){ toast('Required: '+miss.map(f=>f.label).join(', '),'bad','Missing fields'); return false; }
  const unit=readSel('r_unit');
  if(!unit){ toast('Choose or type a unit of measure','bad'); return false; }
  const track=$('#r_tracklow').checked, cut=$('#r_lowcut').value;
  if(track && cut===''){ toast('Enter the low-stock cut-off value','bad'); $('#r_lowcut').focus(); return false; }
  const promos=fr.promos.slice();
  if(isOtherUsed('r_unit') && DB.uoms.indexOf(unit)<0) promos.push({kind:'uom',label:'Unit of Measure',value:unit});
  const p={categoryId:c.id,name:$('#r_name').value.trim(),unit:unit,location:$('#r_loc').value.trim(),
    trackLow:track,lowCutoff:track?Number(cut):0,fields:fr.values,remarks:'',
    receipt:{date:$('#r_date').value,qty:Number($('#r_qty').value||0),source:$('#r_src').value.trim(),
      refType:readSel('r_reftype'),refNo:$('#r_refno').value.trim(),invoiceNo:$('#r_inv').value.trim(),
      vehicle:$('#r_veh').value.trim(),receivedBy:$('#r_by').value.trim(),unitRate:Number($('#r_rate').value||0),
      taxableAmt:Number($('#r_tax').value||0),gstPct:Number($('#r_gst').value||0),totalAmt:Number($('#r_total').value||0),
      remarks:$('#r_rem').value.trim(),docs:[]}};
  $('#regBtn').disabled=true; busy(true,'Saving to Google Sheet…');
  try{ const before=DB.items.map(x=>x.id); DB=await api('addItem',[p]);
    const n=DB.items.find(x=>before.indexOf(x.id)<0);
    busy(false); toast(p.name+' registered with '+fmtN(p.receipt.qty)+' '+unit,'ok','Material saved');
    if(promos.length) offerPromotions(promos);
    if(n){ S.hist.push({page:'register'}); S.itemId=n.id; S.tab='summary'; S.page='item'; render(); } else go('available');
  }catch(err){ busy(false); $('#regBtn').disabled=false; toast(err.message,'bad','Could not save'); }
  return false;
};

function catCard(c){
  const n=DB.items.filter(i=>i.categoryId===c.id).length + DB.kits.filter(k=>k.categoryId===c.id).length, F=c.fields||[];
  return '<div class="card" style="margin-bottom:11px"><div class="card-h"><span class="dot"></span><h3>'+esc(c.name)+'</h3><span class="tag g">'+n+' record(s) · '+F.length+' field(s)</span><div class="spacer"></div>'
  +'<button class="btn sm primary" onclick="openField(\''+c.id+'\')">+ Add Field</button> <button class="btn sm" onclick="openCat(\''+c.id+'\')">Rename</button> '
  +(n===0?'<button class="btn sm danger" onclick="delCat(\''+c.id+'\')">Delete</button>':'')+'</div>'
  +(c.desc?'<div style="padding:8px 14px 0;font-size:11.5px;color:var(--muted)">'+esc(c.desc)+'</div>':'')
  +(F.length?'<div class="tw"><table><thead><tr><th>Order</th><th>Field</th><th>Type</th><th>Required</th><th>Hint</th><th>Dropdown options</th><th></th></tr></thead><tbody>'
    +F.map((f,k)=>'<tr><td style="white-space:nowrap"><button class="btn xs" onclick="moveField(\''+c.id+'\',\''+f.key+'\',\'up\')" '+(k===0?'disabled':'')+'>↑</button> <button class="btn xs" onclick="moveField(\''+c.id+'\',\''+f.key+'\',\'down\')" '+(k===F.length-1?'disabled':'')+'>↓</button></td>'
      +'<td><b>'+esc(f.label)+'</b><div class="mono" style="font-size:10px;color:var(--muted)">'+esc(f.key)+'</div></td>'
      +'<td><span class="tag n">'+esc(f.type)+'</span></td><td>'+(f.required?'<span class="tag warn">Required</span>':'<span class="tag g">Optional</span>')+'</td>'
      +'<td style="font-size:11px;color:var(--muted);max-width:180px">'+esc(f.hint||'—')+'</td>'
      +'<td style="max-width:280px">'+(f.type==='select'?((f.options||[]).map(o=>'<span class="chip" style="cursor:default;margin:1px">'+esc(o)+' <b style="color:var(--bad);cursor:pointer" onclick="delOpt(\''+c.id+'\',\''+f.key+'\',\''+jq(o)+'\')">×</b></span>').join('')
          +' <button class="btn xs" onclick="addOpt(\''+c.id+'\',\''+f.key+'\')">+ option</button>'):'—')+'</td>'
      +'<td style="text-align:right;white-space:nowrap"><button class="btn xs" onclick="openFieldEdit(\''+c.id+'\',\''+f.key+'\')">Edit</button> <button class="btn xs danger" onclick="delField(\''+c.id+'\',\''+f.key+'\')">Remove</button></td></tr>').join('')
    +'</tbody></table></div>':'<div class="empty" style="padding:16px"><p>No fields yet — add the particulars this category should capture.</p></div>')+'</div>';
}

const kit=id=>DB.kits.find(k=>k.id===id);
function kitDocsAll(k){ const s=new Set(k.docs||[]); (k.moves||[]).forEach(m=>(m.docs||[]).forEach(d=>s.add(d))); (k.repairs||[]).forEach(r=>(r.docs||[]).forEach(d=>s.add(d))); return [...s].filter(d=>doc_(d)); }
function kitLocationStatus(k){
  const openRepair=(k.repairs||[]).slice().sort((a,b)=>(b.dateSent||'').localeCompare(a.dateSent||'')).find(r=>r.status!=='Received');
  if(openRepair) return {kind:'bad',label:'At Repair / Calibration',detail:'With '+(openRepair.sentTo||'—')+' since '+fmtDate(openRepair.dateSent)+' — '+(openRepair.reason||'reason not specified')};
  const mv=(k.moves||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const last=mv[mv.length-1];
  if(last && last.direction==='OUT') return {kind:'warn',label:'Given to '+(last.party||'—'),detail:'Since '+fmtDate(last.date)+' — '+(last.reason||'reason not specified')};
  return {kind:'ok',label:'Available at Substation',detail:k.location||'400 kV Karjat Substation'};
}
function kitHealthCls(s){ s=s||'Healthy'; if(s==='Healthy')return 'Healthy'; if(s==='Faulty')return 'Faulty'; if(/severe/i.test(s))return 'sev'; return 'minor'; }
function kitHealthTag(k){ return '<span class="healthpill '+kitHealthCls(k.status)+'">'+esc(k.status||'Healthy')+'</span>'; }

  const q=S.q.toLowerCase();

window.setKitRegCat=v=>{S.kitRegCat=v;render()};
window.submitKitReg=async e=>{
  e.preventDefault();
  const c=cat(S.kitRegCat||DB.categories.find(x=>x.kind==='kit').id);
  const fr=readFields(c);
  const miss=(c.fields||[]).filter(f=>f.required&&!fr.values[f.key]);
  if(miss.length){ toast('Required: '+miss.map(f=>f.label).join(', '),'bad'); return false; }
  const ownership=readSel('k_owner'), status=readSel('k_status');
  if(!ownership){ toast('Choose or type an ownership type','bad'); return false; }
  if(!status){ toast('Choose or type a status','bad'); return false; }
  const promos=fr.promos.slice();
  if(isOtherUsed('k_owner') && DB.ownerships.indexOf(ownership)<0) promos.push({kind2:'kitOwnerships',label:'Ownership',value:ownership});
  if(isOtherUsed('k_status') && DB.kitStatuses.indexOf(status)<0) promos.push({kind2:'kitStatuses',label:'Kit Status',value:status});
  $('#kitRegBtn').disabled=true; busy(true,'Saving…');
  try{
    const before=DB.kits.map(k=>k.id);
    DB=await api('addKit',[{categoryId:c.id,name:$('#k_name').value.trim(),ownership,ownerDetail:$('#k_ownerdetail').value.trim(),
      status,location:$('#k_loc').value.trim(),fields:fr.values,remarks:$('#k_rem').value.trim()}]);
    const n=DB.kits.find(k=>before.indexOf(k.id)<0);
    busy(false); toast($('#k_name').value.trim()+' registered','ok','Kit saved');
    if(promos.length) offerKitPromotions(promos);
    if(n){ S.hist.push({page:'kitregister'}); S.kitId=n.id; S.kittab='summary'; S.page='kit'; render(); } else go('kits');
  }catch(err){ busy(false); $('#kitRegBtn').disabled=false; toast(err.message,'bad'); }
  return false;
};
function offerKitPromotions(promos){
  if(!promos.length) return;
  modal('Add new option'+(promos.length>1?'s':'')+' for future kits?',
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px">Tick to add permanently.</p>'
    +promos.map((p,n)=>'<label class="check" style="margin-bottom:7px"><input type="checkbox" class="kpromo" data-n="'+n+'" checked><span><b>'+esc(p.value)+'</b> <span style="color:var(--muted);font-weight:500">→ '+esc(p.label)+' list</span></span></label>').join(''),
    '<button class="btn" onclick="closeModal()">Not now</button><button class="btn primary" onclick="applyKitPromos()">Add selected</button>');
  window.__kpromos=promos;
}

function recentKitActivity(k){

function kitSheets(ids){
  const kits=DB.kits.filter(k=>ids.includes(k.id));
  if(kits.length===1){
    const k=kits[0], c=cat(k.categoryId);
    const info=[['Field','Value'],['Kit Name',k.name],['Category',c.name],['Ownership',k.ownership||''],['Owner Detail',k.ownerDetail||''],['Status',k.status||''],['Location',k.location||'']];
    (c.fields||[]).forEach(f=>info.push([f.label,String((k.fields&&k.fields[f.key])||'')]));
    if(k.remarks) info.push(['Remarks',k.remarks]);
    const mh=[['Direction','Date','Party','Reason','Reference','Expected Return','Actual Return','Remarks']];
    (k.moves||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(m=>mh.push([m.direction,fmtDate(m.date),m.party||'',m.reason||'',[m.refType,m.refNo].filter(Boolean).join(' '),fmtDate(m.expectedReturn),fmtDate(m.actualReturn),m.remarks||'']));
    const rh=[['Date Sent','Sent To','Reason','Expense Before','Status','Date Received','Actual Expense','Issues','Remarks']];
    (k.repairs||[]).slice().sort((a,b)=>(a.dateSent||'').localeCompare(b.dateSent||'')).forEach(r=>rh.push([fmtDate(r.dateSent),r.sentTo||'',r.reason||'',Number(r.expenseBefore||0),r.status||'',fmtDate(r.dateReceived),Number(r.actualExpense||0),(r.issues||[]).map(x=>x.desc+(x.resolved?' [Resolved]':' [Open]')).join(' | '),r.remarks||'']));
    return [{name:'Summary',rows:info,widths:[26,50]},{name:'Give & Take',rows:mh,widths:[10,12,22,18,22,14,14,26]},{name:'Repairs',rows:rh,widths:[12,20,18,13,10,14,13,40,24]}];
  }
  const s1=[['Sr.','Kit Name','Category','Ownership','Status','Current Status']];

  if(kind==='issue') return (DB.items.flatMap(i=>i.issues||[]).find(r=>r.id===id)||{}).docs||[];
  if(kind==='kit') return (kit(id)||{}).docs||[];
  if(kind==='kitmove') return (DB.kits.flatMap(k=>k.moves||[]).find(r=>r.id===id)||{}).docs||[];
  if(kind==='kitrepair') return (DB.kits.flatMap(k=>k.repairs||[]).find(r=>r.id===id)||{}).docs||[];
  return [];
}

function resizeImg(file,max,q){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>{ const im=new Image();
      im.onload=()=>{ const sc=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas'); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',q).split(',')[1]); };
      im.onerror=rej; im.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file); });
}

  const t=$('#u_title').value.trim(), f=$('#u_file').files[0];
  if(!t){toast('Enter a title','bad');return}
  if(!f){toast('Choose an image','bad');return}
  $('#uBtn').disabled=true; busy(true,'Uploading to Drive…');
  try{ const full=await resizeImg(f,1600,.82), thumb=await resizeImg(f,240,.6);
    DB=await api('uploadDoc',[{title:t,name:f.name,mime:'image/jpeg',full:full,thumb:thumb,link:kind?{kind:kind,id:id}:null}]);
    busy(false); closeModal(); render(); toast(t+' stored in Drive'+(kind?' and attached':''),'ok','Upload complete'); }
  catch(e){ busy(false); const b=$('#uBtn'); if(b)b.disabled=false; toast(e.message,'bad','Upload failed'); } };

/* ---------- render / boot ---------- */
function render(){
  const P={dash:pageDash,available:pageAvailable,low:pageLow,received:pageReceived,issued:pageIssued,register:pageRegister,
           ledger:pageLedger,documents:pageDocuments,admin:pageAdmin,item:pageItem,
           kits:pageKits,kitregister:pageKitRegister,kit:pageKit,users:pageUsers};
  if(S.page==='users' && !isAdmin()) S.page='dash';
  $('#view').innerHTML=(P[S.page]||pageDash)();
  document.querySelectorAll('[data-sec]').forEach(el=>el.classList.remove('no-print'));
  renderNav();
}

/* ---------- auth ---------- */
window.showAuthTab=t=>{
  $('#tabLoginBtn').classList.toggle('on',t==='login'); $('#tabRegBtn').classList.toggle('on',t==='reg');
  $('#authLogin').style.display=t==='login'?'':'none'; $('#authReg').style.display=t==='reg'?'':'none';
  $('#loginMsg').className='loginmsg'; $('#regMsg').className='loginmsg';
};
function authMsg(id,msg,kind){
  if(msg==='STALE_DEPLOYMENT') return;          // showStale() already rendered the full guidance
  const el=$(id); el.textContent=msg; el.className='loginmsg show '+(kind||'bad');
}
window.doLogin=async()=>{
  const u=$('#li_user').value.trim(), p=$('#li_pass').value;
  if(!u||!p){ authMsg('#loginMsg','Enter username and password'); return; }
  $('#loginBtn').disabled=true;
  try{
    const r=await api('login',[u,p]);
    TOKEN=r.token; ME={username:r.username,fullName:r.fullName,role:r.role};
    localStorage.setItem('karjat_token',TOKEN); localStorage.setItem('karjat_me',JSON.stringify(ME));
    $('#loginwrap').style.display='none'; $('#appRoot').style.display='';
    $('#loginMsg').className='loginmsg';
    boot(true);
  }catch(e){ authMsg('#loginMsg',e.message); }
  finally{ $('#loginBtn').disabled=false; }
};
window.doRegister=async()=>{
  const n=$('#rg_name').value.trim(), u=$('#rg_user').value.trim(), p=$('#rg_pass').value;
  if(!u||!p){ authMsg('#regMsg','Choose a username and password'); return; }
  $('#regBtn2').disabled=true;
  try{ await api('register',[u,p,n]);
    authMsg('#regMsg','Request submitted. An admin must approve your account before you can sign in.','ok');
    $('#rg_user').value=''; $('#rg_pass').value=''; $('#rg_name').value='';
  }catch(e){ authMsg('#regMsg',e.message); }
  finally{ $('#regBtn2').disabled=false; }
};
window.doLogout=(silent)=>{
  TOKEN=''; ME={username:'',fullName:'',role:'viewer'};
  localStorage.removeItem('karjat_token'); localStorage.removeItem('karjat_me');
  USERS_CACHE=[];
  $('#appRoot').style.display='none'; $('#loginwrap').style.display='flex';
  $('#li_pass').value=''; $('#loginBtn').disabled=false;
  $('#loginMsg').className='loginmsg'; $('#regMsg').className='loginmsg';
  showAuthTab('login');
  if(!silent) toast('Signed out','ok');
};

async function boot(fresh){
  busy(true,'Connecting to database…');
  try{
    DB=await api('getBootstrap');
    if(isAdmin()){ await loadUsers(); }
    busy(false); render(); renderBell();
    if(DB.version && DB.version!==FRONTEND_VERSION){
      toast('Backend is v'+DB.version+' but this page expects v'+FRONTEND_VERSION+'. Publish a New version in Apps Script.','warn','Version mismatch');
    }
    if(fresh) toast(DB.items.length+' materials · '+DB.kits.length+' kits · '+DB.docs.length+' documents','ok','Connected');
  }catch(e){
    busy(false);
    if(/log in again/i.test(e.message)){ doLogout(true); return; }
    $('#view').innerHTML='<div class="card"><div class="empty"><h1 style="font-size:18px;color:var(--bad);margin-bottom:8px">Could not reach the database</h1>'
      +'<p class="mono" style="background:#fdeceb;padding:8px 12px;border-radius:6px;display:inline-block">'+esc(e.message)+'</p>'
      +'<ul style="text-align:left;max-width:540px;margin:14px auto;font-size:12.5px">'
      +'<li>Run <b>migrate()</b> once in the Apps Script editor (safe to re-run)</li>'
      +'<li>Deploy the web app with <b>Who has access: Anyone</b></li>'
      +'<li>After editing Code.gs, create a <b>New deployment</b> — saving alone does not update the live app</li></ul>'
      +'<button class="btn primary" onclick="boot(true)">Retry</button></div></div>'; renderNav();
  }
}
function init(){
  initLb();
  $('#btnRefresh').onclick=async()=>{ busy(true,'Refreshing…'); try{ DB=await api('getBootstrap'); busy(false); render(); toast('Data reloaded','ok'); }catch(e){ busy(false); toast(e.message,'bad'); } };
  $('#btnLogout').onclick=()=>doLogout();
  $('#hamb').onclick=()=>{ $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); };
  $('#scrim').onclick=()=>{ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); };
  $('#bellBtn').onclick=e=>{ e.stopPropagation(); $('#bellPanel').classList.toggle('open'); renderBell(); };
  document.addEventListener('click',e=>{ if(!e.target.closest('.bellpanel')&&!e.target.closest('#bellBtn')) $('#bellPanel').classList.remove('open'); });
  $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
  let t; $('#q').addEventListener('input',e=>{ clearTimeout(t); t=setTimeout(()=>{ S.q=e.target.value.trim();
    if(S.q && ['available','issued','ledger','received'].indexOf(S.page)<0){ S.hist.push(snap()); S.page='available'; } render(); },200); });
  if(TOKEN && ME.username){ $('#loginwrap').style.display='none'; $('#appRoot').style.display=''; boot(true); }
  else { $('#loginwrap').style.display='flex'; $('#appRoot').style.display='none'; }
}
init();
</script>
</body>
</html>
