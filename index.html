<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spare Material Register — 400 kV Karjat SS | MSETCL</title>
<style>
:root{
  --navy:#16294d; --navy2:#1F3864; --blue:#2E5496; --blue-l:#3f6cb5; --accent:#0e7c86;
  --ink:#16202e; --muted:#5d6b80; --line:#dde3ee; --bg:#eef1f6; --card:#fff;
  --ok:#1a7f45; --ok-bg:#e4f5ea; --warn:#9a6a00; --warn-bg:#fdf2d8; --bad:#b3261e; --bad-bg:#fdeceb;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 6px 20px rgba(16,32,64,.08); --radius:10px;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
.app{display:flex;min-height:100vh}
.sidebar{width:238px;background:linear-gradient(180deg,var(--navy),#0f1d38);color:#fff;flex:0 0 auto;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.brand{padding:15px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .b1{font-weight:800;font-size:13.5px;line-height:1.25}
.brand .b2{font-size:11px;opacity:.72;margin-top:3px}
.nav{padding:9px 8px;overflow-y:auto;flex:1}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:.9px;opacity:.5;padding:11px 10px 5px}
.nav button{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;color:#dbe4f5;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:1px;background:none;border:0;width:100%;text-align:left}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.active{background:var(--blue);color:#fff}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.18);border-radius:20px;padding:1px 7px;font-size:10.5px;font-weight:700}
.nav .badge.alert{background:#e5484d}
.side-foot{padding:9px 10px;border-top:1px solid rgba(255,255,255,.12);font-size:10.5px;opacity:.65}
.side-foot a{color:#a8c4f5}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:#f7f9fc;outline:none}
.search input:focus{border-color:var(--blue);background:#fff}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.45}
.top-right{margin-left:auto;display:flex;align-items:center;gap:7px}
.role{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.role button{padding:6px 11px;border:0;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.role button.on{background:var(--navy2);color:#fff}
.content{padding:16px;flex:1;max-width:1500px;width:100%}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.crumb button{background:none;border:0;color:var(--blue);cursor:pointer;font-size:12px;font-weight:600;padding:0}
.crumb .sep{opacity:.5}
.page-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
.page-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.page-head .spacer{flex:1}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-l);color:#fff}
.btn.danger{color:var(--bad);border-color:#f3c9c6}
.btn.danger:hover{background:var(--bad-bg)}
.btn.warn{color:var(--warn);border-color:#e9d19a}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btn.xs{padding:3px 7px;font-size:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.back{background:#f2f5fa}
.link{background:none;border:0;color:var(--blue);cursor:pointer;font-size:12.5px;font-weight:600;padding:0;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card-h h3{font-size:14px;font-weight:700}
.card-h .spacer{flex:1}
.card-b{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.kpi.ok::before{background:var(--ok)} .kpi.warn::before{background:var(--warn)} .kpi.accent::before{background:var(--accent)} .kpi.bad::before{background:var(--bad)}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
.kpi .d{font-size:11px;color:var(--muted);margin-top:1px}
.kpi.clickable{cursor:pointer} .kpi.clickable:hover{border-color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#f5f7fb;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);white-space:nowrap}
tbody tr:hover{background:#f6f9ff}
tr.clickable{cursor:pointer}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{min-width:620px}
.tw::-webkit-scrollbar{height:8px}
.tw::-webkit-scrollbar-thumb{background:#c5d0e4;border-radius:4px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.n{background:#e8eefb;color:var(--blue)} .tag.g{background:#eceff4;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;font-size:11px;background:#fff;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:0 0 auto}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.banner{border:1px solid #f0c9c6;background:linear-gradient(90deg,#fdeceb,#fff);border-left:4px solid var(--bad);border-radius:var(--radius);padding:11px 14px;margin-bottom:16px}
.banner h4{font-size:13px;color:var(--bad);margin-bottom:5px}
.banner ul{margin:0;padding-left:18px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;font-weight:700;color:var(--muted)}
.f label .req{color:var(--bad)}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,84,150,.12)}
.f .hint{font-size:10.5px;color:var(--muted)}
.other-row{display:flex;gap:6px;align-items:center;margin-top:5px}
.other-row input{flex:1}
.check{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.check input{width:auto;margin:0} .check span{font-size:12.5px;font-weight:600}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 14px;background:#fff}
legend{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);padding:0 6px}
.modal{position:fixed;inset:0;background:rgba(12,20,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:16px;overflow-y:auto}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:12px;max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.modal-h{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:15px;font-weight:800}
.modal-h .x{margin-left:auto;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-b{padding:15px}
.modal-f{padding:11px 15px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;border:0;background:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:20px;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--muted)}
.subtabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dl{display:grid;grid-template-columns:auto 1fr;gap:0}
.dl dt{padding:7px 12px 7px 0;font-size:11.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.dl dd{padding:7px 0;margin:0;font-size:13px;border-bottom:1px solid var(--line);word-break:break-word}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.gal figure:hover{box-shadow:var(--shadow)}
.gal .imgwrap{cursor:zoom-in;position:relative}
.gal img{width:100%;height:92px;object-fit:cover;display:block;background:#f0f2f6}
.gal figcaption{font-size:10px;padding:5px 6px;color:var(--muted);border-top:1px solid var(--line);line-height:1.3}
.gal .drow{display:flex;gap:4px;padding:5px 6px;border-top:1px solid var(--line);background:#fafbfd}
.gal .drow a,.gal .drow button{font-size:10px;padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);text-decoration:none;flex:1;text-align:center}
.gal .drow a:hover,.gal .drow button:hover{border-color:var(--blue);color:var(--blue)}
.lb{position:fixed;inset:0;background:rgba(8,11,18,.97);z-index:500;display:none;flex-direction:column}
.lb.open{display:flex}
.lb-t{display:flex;align-items:center;gap:7px;padding:8px 11px;background:rgba(18,24,38,.94);color:#fff;flex-wrap:wrap}
.lb-t .ti{flex:1;min-width:70px;font-size:12px;opacity:.9;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;text-decoration:none}
.lb-z{color:#fff;font-size:11px;min-width:36px;text-align:center;opacity:.75}
.lb-s{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;position:relative}
.lb-s img{max-width:94%;max-height:92%;transition:transform .12s;user-select:none;background:#fff}
.lb-load{position:absolute;color:#fff;font-size:13px;opacity:.85}
.toasts{position:fixed;bottom:16px;right:16px;z-index:600;display:flex;flex-direction:column;gap:8px;max-width:min(360px,90vw)}
.toast{background:#fff;border-left:4px solid var(--blue);color:var(--ink);padding:10px 12px;border-radius:8px;font-size:12.5px;box-shadow:0 10px 30px rgba(16,32,64,.22);display:flex;gap:9px;align-items:flex-start;animation:tin .22s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
.toast .ic{font-weight:800;font-size:13px;line-height:1.3}
.toast.ok .ic{color:var(--ok)} .toast.bad .ic{color:var(--bad)} .toast.warn .ic{color:var(--warn)} .toast .ic{color:var(--blue)}
.toast .tx{flex:1} .toast .tt{font-weight:700;margin-bottom:1px}
.toast .cl{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0}
@keyframes tin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.loader{position:fixed;inset:0;background:rgba(238,241,246,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:11px;z-index:400}
.loader.hide{display:none}
.spin{width:32px;height:32px;border:3px solid #cfd9ea;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
.scrim.on{display:block}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none}
  .hamb{display:inline-flex}
  .content{padding:12px}
  .page-head h1{font-size:17px}
  .kpi .v{font-size:19px}
}
@media(max-width:560px){
  .dl{grid-template-columns:1fr}
  .dl dt{border-bottom:0;padding-bottom:0}
  .dl dd{padding-top:2px}
  .top-right .role{display:none}
  .acts .btn{flex:1;justify-content:center}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media print{
  .sidebar,.topbar,.no-print,.tabs,.subtabs,.toasts,.loader,.crumb{display:none!important}
  body{background:#fff;font-size:11px}.app{display:block}.content{padding:0;max-width:100%}
  .card{border:1px solid #bbb;box-shadow:none;break-inside:avoid;margin-bottom:8px}
  .tw{overflow:visible}.tw table{min-width:0}
  th,.tag,.kpi::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-head{display:block!important;margin-bottom:12px;border-bottom:2px solid var(--navy);padding-bottom:8px}
  .gal img{height:auto}
}
.print-head{display:none} .print-head h2{font-size:15px} .print-head .m{font-size:10px;color:#444}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="b1">MSETCL — 400 kV Karjat SS</div><div class="b2">Spare Material Register</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot">Loading…</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar">
      <button class="hamb" id="hamb"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="q" placeholder="Search material, serial no., category…" autocomplete="off">
      </div>
      <div class="top-right">
        <div class="role"><button id="roleEditor">Editor</button><button id="roleAdmin">Admin</button></div>
        <button class="btn sm" id="btnRefresh">Refresh</button>
      </div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="lb" id="lb">
  <div class="lb-t">
    <button class="lbb" id="lbBack">&#8592; Back</button>
    <div class="ti" id="lbTitle"></div>
    <button class="lbb" id="lbOut">&minus;</button><span class="lb-z" id="lbZ">100%</span><button class="lbb" id="lbIn">+</button>
    <a class="lbb" id="lbDrive" target="_blank" rel="noopener">Drive &#8599;</a>
    <a class="lbb" id="lbDl" download>&#8595; Download</a>
    <button class="lbb" id="lbClose">&times; Close</button>
  </div>
  <div class="lb-s" id="lbStage"><div class="lb-load" id="lbLoad">Loading…</div><img id="lbImg" src="" alt=""></div>
</div>
<div class="toasts" id="toasts"></div>
<div class="loader" id="loader"><div class="spin"></div><div id="loadMsg" style="font-size:13px;color:#5d6b80">Connecting…</div></div>

<script>
/* =====================  YOUR WEB APP URL  ===================== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz1cWp-eNVKyccMjg7JsCc_JJtfSgnZq7XlDObDCWGd78fN32PMukDEze1GR-YXv0JUkA/exec';
/* ============================================================== */

const USE_GS = (typeof google !== 'undefined' && google.script && google.script.run);
function api(fn,args){
  args=args||[];
  if(USE_GS) return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e.message||e))).__api__(fn,args));
  return fetch(WEB_APP_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({fn:fn,args:args})}).then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'Server error'); return j.data; });
}
let DB={settings:{},uoms:[],categories:[],items:[],docs:[],serverDate:'',folderUrl:''};
const S={page:'dash',itemId:null,tab:'summary',doctab:'all',q:'',cat:null,regCat:null,role:'editor',hist:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jq=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const fmtDate=d=>{ if(!d) return '—'; const p=String(d).split('-'); return p.length===3? p[2]+'.'+p[1]+'.'+p[0] : d; };
const fmtN=n=>{ n=Number(n||0); return n%1===0? String(n) : n.toFixed(2); };
const money=n=>{ n=Number(n||0); return n? '₹ '+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'; };
const money0=n=>'₹ '+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const cat=id=>DB.categories.find(c=>c.id===id)||{name:'—',fields:[]};
const item=id=>DB.items.find(i=>i.id===id);
const doc_=id=>DB.docs.find(d=>d.id===id);
const recvQty=i=>(i.receipts||[]).reduce((s,r)=>s+Number(r.qty||0),0);
const issQty=i=>(i.issues||[]).reduce((s,r)=>s+Number(r.qty||0),0);
const availQty=i=>recvQty(i)-issQty(i);
const recvVal=i=>(i.receipts||[]).reduce((s,r)=>s+Number(r.totalAmt||0),0);
const isAdmin=()=>S.role==='admin';
const isLow=i=>!!i.trackLow && availQty(i)<=Number(i.lowCutoff||0);
const lowItems=()=>DB.items.filter(isLow);
function lastAct(i){ const d=[...(i.receipts||[]).map(r=>r.date),...(i.issues||[]).map(r=>r.date)].filter(Boolean).sort(); return d.length?d[d.length-1]:String(i.createdAt||'').slice(0,10); }
function stockTag(i){ const a=availQty(i);
  if(isLow(i)) return '<span class="tag bad">Low — '+fmtN(a)+' ≤ '+fmtN(i.lowCutoff)+'</span>';
  if(a<=0) return '<span class="tag g">Nil stock</span>';
  return '<span class="tag ok">'+fmtN(a)+' available</span>'; }
function itemDocs(i){ const s=new Set(i.docs||[]); (i.receipts||[]).forEach(r=>(r.docs||[]).forEach(d=>s.add(d))); (i.issues||[]).forEach(r=>(r.docs||[]).forEach(d=>s.add(d))); return [...s].filter(d=>doc_(d)); }

/* ---------- toasts (bottom right) ---------- */
function toast(msg,kind,title){
  const ic={ok:'✓',bad:'✕',warn:'⚠'}[kind]||'i';
  const d=document.createElement('div'); d.className='toast '+(kind||'');
  d.innerHTML='<div class="ic">'+ic+'</div><div class="tx">'+(title?'<div class="tt">'+esc(title)+'</div>':'')+esc(msg)+'</div><button class="cl">×</button>';
  d.querySelector('.cl').onclick=()=>d.remove();

function lbClose(){ $('#lb').classList.remove('open'); $('#lbImg').src=''; document.body.style.overflow=''; }
function initLb(){
  $('#lbClose').onclick=lbClose; $('#lbBack').onclick=lbClose;
  $('#lbIn').onclick=()=>{LB.s=Math.min(LB.s*1.35,6);lbApply()};
  $('#lbOut').onclick=()=>{LB.s=Math.max(LB.s/1.35,.4);lbApply()};
  $('#lb').addEventListener('click',e=>{ if(e.target.id==='lb'||e.target.id==='lbStage') lbClose(); });
  document.addEventListener('keydown',e=>{ if(!$('#lb').classList.contains('open'))return;
    if(e.key==='Escape')lbClose(); if(e.key==='+'||e.key==='=')$('#lbIn').click(); if(e.key==='-')$('#lbOut').click(); });
  const st=$('#lbStage');
  st.addEventListener('wheel',e=>{e.preventDefault();LB.s=Math.min(Math.max(LB.s*(e.deltaY<0?1.15:1/1.15),.4),6);lbApply()},{passive:false});
  st.addEventListener('mousedown',e=>{ if(e.target.id!=='lbImg')return; LB.drag=true;LB.sx=e.clientX-LB.x;LB.sy=e.clientY-LB.y;e.preventDefault(); });
  addEventListener('mousemove',e=>{ if(LB.drag){LB.x=e.clientX-LB.sx;LB.y=e.clientY-LB.sy;lbApply()} });
  addEventListener('mouseup',()=>LB.drag=false);
  st.addEventListener('touchstart',e=>{ if(e.touches.length===1){LB.drag=true;LB.sx=e.touches[0].clientX-LB.x;LB.sy=e.touches[0].clientY-LB.y}
    else if(e.touches.length===2){LB.d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)} },{passive:true});
  st.addEventListener('touchmove',e=>{ if(e.touches.length===1&&LB.drag){LB.x=e.touches[0].clientX-LB.sx;LB.y=e.touches[0].clientY-LB.sy;lbApply()}
    else if(e.touches.length===2&&LB.d){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);LB.s=Math.min(Math.max(LB.s*(d/LB.d),.4),6);LB.d=d;lbApply()} },{passive:true});
  st.addEventListener('touchend',()=>{LB.drag=false;LB.d=null});
  $('#lbImg').addEventListener('dblclick',()=>{ if(LB.s>1){LB.s=1;LB.x=0;LB.y=0}else LB.s=2.2; lbApply(); });
}

function readSel(id){ const s=document.getElementById(id); if(!s) return '';
  if(s.value===OTHER){ const o=document.getElementById(id+'_o'); return o?o.value.trim():''; } return s.value; }
function isOtherUsed(id){ const s=document.getElementById(id); return s && s.value===OTHER && readSel(id); }

function fieldInput(f,val){
  const v=val==null?'':val, id='cf_'+f.key;
  let inp;
  if(f.type==='select') inp=selectWithOther(id,f.options,v,'Type a new '+f.label.toLowerCase());
  else if(f.type==='textarea') inp='<textarea id="'+id+'" rows="2">'+esc(v)+'</textarea>';
  else if(f.type==='number') inp='<input id="'+id+'" type="number" step="any" value="'+esc(v)+'">';
  else if(f.type==='date') inp='<input id="'+id+'" type="date" value="'+esc(v)+'">';
  else inp='<input id="'+id+'" value="'+esc(v)+'"'+(f.hint?' placeholder="'+esc(f.hint)+'"':'')+'>';
  return '<div class="f"><label>'+esc(f.label)+(f.required?' <span class="req">*</span>':'')+'</label>'+inp
    +(f.hint&&f.type!=='text'?'<div class="hint">'+esc(f.hint)+'</div>':'')+'</div>';
}
function readFields(c){
  const out={}, promos=[];
  (c.fields||[]).forEach(f=>{
    const id='cf_'+f.key;
    let v;
    if(f.type==='select'){ v=readSel(id); if(isOtherUsed(id) && (f.options||[]).indexOf(v)<0 && v) promos.push({kind:'field',catId:c.id,key:f.key,label:f.label,value:v}); }
    else { const el=document.getElementById(id); v=el?el.value.trim():''; }
    if(v) out[f.key]=v;
  });
  return {values:out,promos:promos};
}
/** After a save, offer to make typed "Other…" values permanent. */
function offerPromotions(promos){
  if(!promos.length) return;
  modal('Add new option'+(promos.length>1?'s':'')+' for future entries?',
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px">You typed value'+(promos.length>1?'s':'')+' that are not in the dropdown yet. Tick to add '+(promos.length>1?'them':'it')+' permanently, so next time '+(promos.length>1?'they appear':'it appears')+' in the list.</p>'
    +promos.map((p,n)=>'<label class="check" style="margin-bottom:7px"><input type="checkbox" class="promo" data-n="'+n+'" checked>'
      +'<span><b>'+esc(p.value)+'</b> <span style="color:var(--muted);font-weight:500">→ '+esc(p.kind==='uom'?'Unit of Measure list':p.label+' dropdown')+'</span></span></label>').join(''),
    '<button class="btn" onclick="closeModal()">Not now</button><button class="btn primary" onclick="applyPromos()">Add selected</button>');
  window.__promos=promos;
};
window.applyPromos=async()=>{
  const picks=[...document.querySelectorAll('.promo')].filter(c=>c.checked).map(c=>window.__promos[+c.dataset.n]);
  closeModal();
  if(!picks.length) return;
  busy(true,'Adding option'+(picks.length>1?'s':'')+'…');
  try{
    for(const p of picks){
      if(p.kind==='uom') DB=await api('addUom',[p.value]);
      else DB=await api('addFieldOption',[p.catId,p.key,p.value]);
      toast('“'+p.value+'” added to '+(p.kind==='uom'?'Unit of Measure list':p.label+' dropdown'),'ok','Dropdown updated');
    }
    busy(false); render();
  }catch(e){ busy(false); toast(e.message,'bad'); }
};

function recvTable(i){
  const recs=(i.receipts||[]).slice().sort((x,y)=>(x.date||'').localeCompare(y.date||''));

  return '<div class="tw"><table><thead><tr><th>Date</th><th class="num">Qty</th><th>Source</th><th>Reference</th><th class="num">Amount</th></tr></thead><tbody>'
   +recs.map(x=>'<tr><td class="mono">'+fmtDate(x.date)+'</td><td class="num">+'+fmtN(x.qty)+'</td><td>'+esc(x.source||'—')+'</td><td style="font-size:11px">'+esc([x.refType,x.refNo].filter(Boolean).join(' ')||'—')+'</td><td class="num">'+(x.totalAmt?money(x.totalAmt):'—')+'</td></tr>').join('')

function issTable(i){

   +iss.map(x=>'<tr><td class="mono">'+fmtDate(x.date)+'</td><td class="num">−'+fmtN(x.qty)+'</td><td>'+esc(x.purpose||'—')+'</td><td>'+esc(x.issuedTo||'—')+'</td><td style="font-size:11px;color:var(--muted)">'+esc(x.workDetails||'—')+'</td></tr>').join('')

/** Documents tab: one sub-tab per consignment + item-level, brief data then attachments. */
function tabDocs(i){
  const groups=[{key:'all',label:'All ('+itemDocs(i).length+')'}];
  (i.receipts||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach((r,n)=>
    groups.push({key:'r'+r.id,label:'Receipt '+(n+1)+' · '+fmtDate(r.date)}));
  (i.issues||[]).forEach((r,n)=>groups.push({key:'i'+r.id,label:'Issue '+(n+1)+' · '+fmtDate(r.date)}));
  groups.push({key:'item',label:'Material-level'});
  if(!groups.some(g=>g.key===S.doctab)) S.doctab='all';
  let brief='', docs=[], unlinkKind=null, unlinkId=null;
  if(S.doctab==='all'){ docs=itemDocs(i);
    brief='<dl class="dl">'+row('Material',i.name)+row('Category',cat(i.categoryId).name)+row('Documents',docs.length+' file(s) linked')+'</dl>'; }
  else if(S.doctab==='item'){ docs=(i.docs||[]).filter(d=>doc_(d)); unlinkKind='item'; unlinkId=i.id;
    brief='<dl class="dl">'+row('Scope','Documents attached to the material itself (nameplates, manuals, test reports)')+'</dl>'; }
  else if(S.doctab[0]==='r'){ const r=(i.receipts||[]).find(x=>'r'+x.id===S.doctab);
    if(r){ docs=(r.docs||[]).filter(d=>doc_(d)); unlinkKind='receipt'; unlinkId=r.id;
      brief='<dl class="dl">'+row('Date of Receipt',fmtDate(r.date))+row('Quantity',fmtN(r.qty)+' '+(i.unit||''))+row('Received From',r.source)
        +row('Reference',[r.refType,r.refNo].filter(Boolean).join(' '))+row('Invoice No.',r.invoiceNo)+row('Vehicle / LR',r.vehicle)
        +(r.totalAmt?row('Total Amount',money(r.totalAmt)):'')+row('Received By',r.receivedBy)+row('Remarks',r.remarks)+'</dl>'; } }
  else { const r=(i.issues||[]).find(x=>'i'+x.id===S.doctab);
    if(r){ docs=(r.docs||[]).filter(d=>doc_(d)); unlinkKind='issue'; unlinkId=r.id;
      brief='<dl class="dl">'+row('Date of Issue',fmtDate(r.date))+row('Quantity',fmtN(r.qty)+' '+(i.unit||''))+row('Purpose',r.purpose)
        +row('Issued To',r.issuedTo)+row('Work / Details',r.workDetails)+row('Authorised By',r.authorisedBy)+'</dl>'; } }
  return '<div class="subtabs no-print">'+groups.map(g=>'<button class="'+(S.doctab===g.key?'on':'')+'" onclick="setDocTab(\''+g.key+'\')">'+esc(g.label)+'</button>').join('')+'</div>'
  +'<div class="card" data-sec="sec-docs" style="margin-bottom:12px"><div class="card-h"><h3>Details</h3></div><div class="card-b">'+(brief||'<div class="empty"><p>—</p></div>')+'</div></div>'
  +'<div class="card" data-sec="sec-docs"><div class="card-h"><h3>Attachments</h3><span class="tag g">'+docs.length+'</span><div class="spacer"></div>'
  +(unlinkKind?'<button class="btn sm no-print" onclick="openLink(\''+unlinkKind+'\',\''+unlinkId+'\')">Link existing</button> <button class="btn sm primary no-print" onclick="openUpload(\''+unlinkKind+'\',\''+unlinkId+'\')">+ Upload</button>':'')
  +'</div><div class="card-b">'
  +(docs.length?'<div class="gal">'+docs.map(d=>docCard(doc_(d),null,unlinkKind?'unlinkDoc(\''+unlinkKind+'\',\''+unlinkId+'\',\''+d+'\')':null)).join('')+'</div>'
    :'<div class="empty"><p>No documents in this group.</p>'+(unlinkKind?'<p class="no-print"><button class="btn sm" onclick="openLink(\''+unlinkKind+'\',\''+unlinkId+'\')">Link existing document</button></p>':'')+'</div>')
  +'</div></div>';
}

  +'<div class="f"><label>Taxable Amount (₹)</label><input id="r_tax" type="number" step="any" min="0" oninput="calcAmt(1)"><div class="hint">Auto = rate × qty</div></div>'

  +'</div><div class="f" style="margin-top:11px"><label>Remarks</label><textarea id="r_rem" rows="2"></textarea></div></fieldset>'

window.setRegCat=v=>{S.regCat=v;render()};
window.toggleLow=()=>{ const on=$('#r_tracklow').checked; $('#lowWrap').style.display=on?'':'none'; if(on)$('#r_lowcut').focus(); };
window.calcAmt=(t)=>{ const q=Number($('#r_qty').value||0),r=Number($('#r_rate').value||0),g=Number($('#r_gst').value||0);
  const tx=$('#r_tax'),tot=$('#r_total'); if(t)tx.dataset.touched='1';
  if(r&&q&&!tx.dataset.touched) tx.value=+(r*q).toFixed(2);
  const tv=Number(tx.value||0); if(tv&&!tot.dataset.touched) tot.value=+(tv*(1+g/100)).toFixed(2); };
window.submitReg=async e=>{
  e.preventDefault();
  const c=cat(S.regCat||DB.categories[0].id);
  const fr=readFields(c);
  const miss=(c.fields||[]).filter(f=>f.required&&!fr.values[f.key]);
  if(miss.length){ toast('Required: '+miss.map(f=>f.label).join(', '),'bad','Missing fields'); return false; }
  const unit=readSel('r_unit');
  if(!unit){ toast('Choose or type a unit of measure','bad'); return false; }
  const track=$('#r_tracklow').checked, cut=$('#r_lowcut').value;
  if(track && cut===''){ toast('Enter the low-stock cut-off value','bad'); $('#r_lowcut').focus(); return false; }
  const promos=fr.promos.slice();
  if(isOtherUsed('r_unit') && DB.uoms.indexOf(unit)<0) promos.push({kind:'uom',label:'Unit of Measure',value:unit});
  const p={categoryId:c.id,name:$('#r_name').value.trim(),unit:unit,location:$('#r_loc').value.trim(),
    trackLow:track,lowCutoff:track?Number(cut):0,fields:fr.values,remarks:'',
    receipt:{date:$('#r_date').value,qty:Number($('#r_qty').value||0),source:$('#r_src').value.trim(),
      refType:readSel('r_reftype'),refNo:$('#r_refno').value.trim(),invoiceNo:$('#r_inv').value.trim(),
      vehicle:$('#r_veh').value.trim(),receivedBy:$('#r_by').value.trim(),unitRate:Number($('#r_rate').value||0),
      taxableAmt:Number($('#r_tax').value||0),gstPct:Number($('#r_gst').value||0),totalAmt:Number($('#r_total').value||0),
      remarks:$('#r_rem').value.trim(),docs:[]}};
  $('#regBtn').disabled=true; busy(true,'Saving to Google Sheet…');
  try{ const before=DB.items.map(x=>x.id); DB=await api('addItem',[p]);
    const n=DB.items.find(x=>before.indexOf(x.id)<0);
    busy(false); toast(p.name+' registered with '+fmtN(p.receipt.qty)+' '+unit,'ok','Material saved');
    if(promos.length) offerPromotions(promos);
    if(n){ S.hist.push({page:'register'}); S.itemId=n.id; S.tab='summary'; S.page='item'; render(); } else go('available');
  }catch(err){ busy(false); $('#regBtn').disabled=false; toast(err.message,'bad','Could not save'); }
  return false;
};

function pageAdmin(){
  if(!isAdmin()) return crumb(['Categories & Fields',''])+'<div class="card"><div class="empty"><p><b>Admin access required.</b></p><p>Switch the role selector in the top bar to <b>Admin</b>.</p></div></div>';
  return crumb(['Categories & Fields',''])
  +'<div class="page-head"><div><h1>Categories &amp; Fields</h1><div class="sub">Build the entry form for each material type. Editors fill in what you define here.</div></div><div class="spacer"></div>'
  +'<div class="acts no-print"><button class="btn back" onclick="back()">← Back</button><button class="btn" onclick="openUoms()">Units of Measure ('+DB.uoms.length+')</button><button class="btn primary" onclick="openCat()">+ New Category</button></div></div>'
  +DB.categories.map(c=>{
    const n=DB.items.filter(i=>i.categoryId===c.id).length, F=c.fields||[];
    return '<div class="card" style="margin-bottom:11px"><div class="card-h"><span class="dot"></span><h3>'+esc(c.name)+'</h3><span class="tag g">'+n+' item(s) · '+F.length+' field(s)</span><div class="spacer"></div>'
    +'<button class="btn sm primary" onclick="openField(\''+c.id+'\')">+ Add Field</button> <button class="btn sm" onclick="openCat(\''+c.id+'\')">Rename</button> '
    +(n===0?'<button class="btn sm danger" onclick="delCat(\''+c.id+'\')">Delete</button>':'')+'</div>'
    +(c.desc?'<div style="padding:8px 14px 0;font-size:11.5px;color:var(--muted)">'+esc(c.desc)+'</div>':'')
    +(F.length?'<div class="tw"><table><thead><tr><th>Order</th><th>Field</th><th>Type</th><th>Required</th><th>Hint</th><th>Dropdown options</th><th></th></tr></thead><tbody>'
      +F.map((f,k)=>'<tr><td style="white-space:nowrap"><button class="btn xs" onclick="moveField(\''+c.id+'\',\''+f.key+'\',\'up\')" '+(k===0?'disabled':'')+'>↑</button> <button class="btn xs" onclick="moveField(\''+c.id+'\',\''+f.key+'\',\'down\')" '+(k===F.length-1?'disabled':'')+'>↓</button></td>'
        +'<td><b>'+esc(f.label)+'</b><div class="mono" style="font-size:10px;color:var(--muted)">'+esc(f.key)+'</div></td>'
        +'<td><span class="tag n">'+esc(f.type)+'</span></td><td>'+(f.required?'<span class="tag warn">Required</span>':'<span class="tag g">Optional</span>')+'</td>'
        +'<td style="font-size:11px;color:var(--muted);max-width:180px">'+esc(f.hint||'—')+'</td>'
        +'<td style="max-width:280px">'+(f.type==='select'?((f.options||[]).map(o=>'<span class="chip" style="cursor:default;margin:1px">'+esc(o)+' <b style="color:var(--bad);cursor:pointer" onclick="delOpt(\''+c.id+'\',\''+f.key+'\',\''+jq(o)+'\')">×</b></span>').join('')
            +' <button class="btn xs" onclick="addOpt(\''+c.id+'\',\''+f.key+'\')">+ option</button>'):'—')+'</td>'
        +'<td style="text-align:right;white-space:nowrap"><button class="btn xs" onclick="openFieldEdit(\''+c.id+'\',\''+f.key+'\')">Edit</button> <button class="btn xs danger" onclick="delField(\''+c.id+'\',\''+f.key+'\')">Remove</button></td></tr>').join('')
      +'</tbody></table></div>':'<div class="empty" style="padding:16px"><p>No fields yet — add the particulars this category should capture.</p></div>')+'</div>';
  }).join('');
}
window.openUoms=()=>{
  modal('Units of Measure',
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 10px">These appear in the Unit dropdown. Editors can type a new one and confirm to add it here automatically.</p>'
    +'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">'+DB.uoms.map(u=>'<span class="chip" style="cursor:default">'+esc(u)+'</span>').join('')+'</div>'
    +'<div class="f"><label>Add a unit</label><div class="other-row"><input id="uom_new" placeholder="e.g. Bundle"><button type="button" class="btn sm primary" onclick="addUom()">Add</button></div></div>',
    '<button class="btn" onclick="closeModal()">Close</button>');
};
window.addUom=async()=>{ const v=$('#uom_new').value.trim(); if(!v){toast('Type a unit','bad');return}
  busy(true,'Adding…'); try{ DB=await api('addUom',[v]); busy(false); closeModal(); render(); toast('“'+v+'” added','ok','Unit of Measure'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.openCat=id=>{ const c=id?cat(id):null;
  modal(c?'Rename Category':'New Category',
    '<div class="f"><label>Category Name <span class="req">*</span></label><input id="c_name" value="'+esc(c?c.name:'')+'" placeholder="e.g. Protection Relays"></div>'
    +'<div class="f" style="margin-top:10px"><label>Description</label><input id="c_desc" value="'+esc(c?c.desc||'':'')+'" placeholder="What belongs in this category"></div>'
    +(c?'':'<p style="font-size:12px;color:var(--muted);margin-top:12px">After creating it, add the fields its entry form should capture.</p>'),
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCat('+(id?"'"+id+"'":'null')+')">Save</button>'); };
window.saveCat=async id=>{ const n=$('#c_name').value.trim(); if(!n){toast('Name required','bad');return}
  busy(true,'Saving…'); try{ DB=await api('saveCategory',[{id:id||'',name:n,desc:$('#c_desc').value.trim()}]);
    busy(false); closeModal(); render(); toast(n,'ok',id?'Category renamed':'Category created'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.delCat=async id=>{ const c=cat(id); if(!confirm('Delete category “'+c.name+'”?'))return;
  busy(true,'Deleting…'); try{ DB=await api('deleteCategory',[id]); busy(false); render(); toast(c.name,'ok','Category deleted'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
function fieldForm(f){
  f=f||{type:'text'};
  return '<div class="grid2"><div class="f"><label>Field Label <span class="req">*</span></label><input id="f_label" value="'+esc(f.label||'')+'" placeholder="e.g. Voltage Class"></div>'
  +'<div class="f"><label>Data Type</label><select id="f_type" onchange="document.getElementById(\'optWrap\').style.display=this.value===\'select\'?\'\':\'none\'">'
  +['text','number','date','select','textarea'].map(t=>'<option value="'+t+'"'+(f.type===t?' selected':'')+'>'+({text:'Text',number:'Number',date:'Date',select:'Dropdown',textarea:'Long text'}[t])+'</option>').join('')+'</select></div></div>'
  +'<div class="f" style="margin-top:10px"><label>Hint text</label><input id="f_hint" value="'+esc(f.hint||'')+'" placeholder="Shown to the editor as guidance / placeholder"></div>'
  +'<div class="f" id="optWrap" style="display:'+(f.type==='select'?'':'none')+';margin-top:10px"><label>Dropdown options (comma separated)</label>'
  +'<input id="f_opts" value="'+esc((f.options||[]).join(', '))+'" placeholder="e.g. 132 kV, 220 kV, 400 kV">'
  +'<div class="hint">Editors can also type “Other…” and be asked whether to add it here permanently.</div></div>'
  +'<label class="check" style="margin-top:10px"><input type="checkbox" id="f_req" '+(f.required?'checked':'')+'><span>Required field</span></label>';
}
window.openField=cid=>modal('Add Field — '+cat(cid).name, fieldForm(null),
  '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveField(\''+cid+'\')">Add Field</button>');
window.saveField=async cid=>{
  const l=$('#f_label').value.trim(); if(!l){toast('Label required','bad');return}
  const key=l.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,28)||('f'+Date.now());
  const t=$('#f_type').value, f={key:key,label:l,type:t,required:$('#f_req').checked,hint:$('#f_hint').value.trim()};
  if(t==='select') f.options=$('#f_opts').value.split(',').map(s=>s.trim()).filter(Boolean);
  busy(true,'Saving…'); try{ DB=await api('saveField',[cid,f]); busy(false); closeModal(); render(); toast(l+' added to '+cat(cid).name,'ok','Field created'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.openFieldEdit=(cid,key)=>{ const f=(cat(cid).fields||[]).find(x=>x.key===key);
  modal('Edit Field — '+f.label, fieldForm(f),
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveFieldEdit(\''+cid+'\',\''+key+'\')">Save</button>'); };
window.saveFieldEdit=async(cid,key)=>{
  const t=$('#f_type').value, p={label:$('#f_label').value.trim(),type:t,required:$('#f_req').checked,hint:$('#f_hint').value.trim()};
  if(t==='select') p.options=$('#f_opts').value.split(',').map(s=>s.trim()).filter(Boolean);
  busy(true,'Saving…'); try{ DB=await api('updateField',[cid,key,p]); busy(false); closeModal(); render(); toast(p.label,'ok','Field updated'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.delField=async(cid,key)=>{ if(!confirm('Remove this field? Values already saved stay in the data.'))return;
  busy(true,'Saving…'); try{ DB=await api('deleteField',[cid,key]); busy(false); render(); toast('Field removed','ok'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.moveField=async(cid,key,dir)=>{ busy(true,'Reordering…');
  try{ DB=await api('moveField',[cid,key,dir]); busy(false); render(); }catch(e){ busy(false); toast(e.message,'bad'); } };
window.addOpt=(cid,key)=>{ const f=(cat(cid).fields||[]).find(x=>x.key===key);
  modal('Add option — '+f.label,'<div class="f"><label>New dropdown option</label><input id="opt_new" placeholder="e.g. 765 kV"></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveOpt(\''+cid+'\',\''+key+'\')">Add</button>'); };
window.saveOpt=async(cid,key)=>{ const v=$('#opt_new').value.trim(); if(!v){toast('Type an option','bad');return}
  busy(true,'Saving…'); try{ DB=await api('addFieldOption',[cid,key,v]); busy(false); closeModal(); render(); toast('“'+v+'” added','ok','Dropdown updated'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.delOpt=async(cid,key,opt)=>{ if(!confirm('Remove option “'+opt+'”?'))return;
  busy(true,'Saving…'); try{ DB=await api('delFieldOption',[cid,key,opt]); busy(false); render(); toast('“'+opt+'” removed','ok'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };

/* ---------- item modals ---------- */
window.openLowFlag=id=>{ const i=item(id);
  modal('Low-stock alert — '+i.name,
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px">Only flagged materials are counted in Low Stock Alerts. Current balance: <b>'+fmtN(availQty(i))+' '+esc(i.unit||'')+'</b>.</p>'
    +'<label class="check"><input type="checkbox" id="lf_track" '+(i.trackLow?'checked':'')+' onchange="document.getElementById(\'lf_wrap\').style.display=this.checked?\'\':\'none\'"><span>Flag this material for low-stock alert</span></label>'
    +'<div class="f" id="lf_wrap" style="margin-top:12px;display:'+(i.trackLow?'':'none')+'"><label>Alert when balance falls to or below <span class="req">*</span></label>'
    +'<input id="lf_cut" type="number" step="any" min="0" value="'+esc(i.trackLow?i.lowCutoff:'')+'"><div class="hint">Unit: '+esc(i.unit||'')+'</div></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveLowFlag(\''+id+'\')">Save</button>'); };
window.saveLowFlag=async id=>{ const i=item(id), track=$('#lf_track').checked, cut=$('#lf_cut').value;
  if(track && cut===''){ toast('Enter the cut-off value','bad'); return; }
  busy(true,'Saving…');
  try{ DB=await api('updateItem',[id,{name:i.name,unit:i.unit,location:i.location,trackLow:track,lowCutoff:track?Number(cut):0,fields:i.fields,remarks:i.remarks}]);
    busy(false); closeModal(); render(); toast(track?(i.name+' — alert at ≤ '+cut+' '+(i.unit||'')):(i.name+' — alert removed'),'ok','Low-stock alert'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };

function receiptForm(i,r){
  r=r||{gstPct:18};
  const today=DB.serverDate||new Date().toISOString().slice(0,10);
  return '<div class="grid2">'
  +'<div class="f"><label>Date <span class="req">*</span></label><input id="ar_date" type="date" value="'+esc(r.date||today)+'"></div>'
  +'<div class="f"><label>Quantity ('+esc(i.unit||'')+') <span class="req">*</span></label><input id="ar_qty" type="number" step="any" min="0" value="'+esc(r.qty||'')+'"></div>'
  +'<div class="f"><label>Received From</label><input id="ar_src" value="'+esc(r.source||'')+'"></div>'
  +'<div class="f"><label>Reference Type</label>'+selectWithOther('ar_reftype',['Gate Pass','Invoice & Delivery Challan','Work Order','Transfer Memo'],r.refType||'','Type a new reference type')+'</div>'
  +'<div class="f"><label>Reference No.</label><input id="ar_refno" value="'+esc(r.refNo||'')+'"></div>'
  +'<div class="f"><label>Invoice No. / Date</label><input id="ar_inv" value="'+esc(r.invoiceNo||'')+'"></div>'
  +'<div class="f"><label>Vehicle / LR No.</label><input id="ar_veh" value="'+esc(r.vehicle||'')+'"></div>'
  +'<div class="f"><label>Received By</label><input id="ar_by" value="'+esc(r.receivedBy||'')+'"></div>'
  +'<div class="f"><label>Unit Rate (₹)</label><input id="ar_rate" type="number" step="any" value="'+esc(r.unitRate||'')+'"></div>'
  +'<div class="f"><label>Taxable Amount (₹)</label><input id="ar_tax" type="number" step="any" value="'+esc(r.taxableAmt||'')+'"></div>'
  +'<div class="f"><label>GST %</label><input id="ar_gst" type="number" step="any" value="'+esc(r.gstPct!=null?r.gstPct:18)+'"></div>'
  +'<div class="f"><label>Total Amount (₹)</label><input id="ar_total" type="number" step="any" value="'+esc(r.totalAmt||'')+'"></div></div>'
  +'<div class="f" style="margin-top:10px"><label>Remarks</label><textarea id="ar_rem" rows="2">'+esc(r.remarks||'')+'</textarea></div>';
}
function readReceipt(){ return {date:$('#ar_date').value,qty:Number($('#ar_qty').value||0),source:$('#ar_src').value.trim(),
  refType:readSel('ar_reftype'),refNo:$('#ar_refno').value.trim(),invoiceNo:$('#ar_inv').value.trim(),vehicle:$('#ar_veh').value.trim(),
  receivedBy:$('#ar_by').value.trim(),unitRate:Number($('#ar_rate').value||0),taxableAmt:Number($('#ar_tax').value||0),
  gstPct:Number($('#ar_gst').value||0),totalAmt:Number($('#ar_total').value||0),remarks:$('#ar_rem').value.trim()}; }
window.openReceipt=id=>modal('Add Receipt — '+item(id).name, receiptForm(item(id),null),
  '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="arBtn" onclick="saveReceipt(\''+id+'\')">Add Receipt</button>');
window.saveReceipt=async id=>{ const p=readReceipt();
  if(!(p.qty>0)){toast('Enter quantity','bad');return}
  $('#arBtn').disabled=true; busy(true,'Saving…');
  try{ p.docs=[]; DB=await api('addReceipt',[id,p]); busy(false); closeModal(); S.tab='receipt'; render();
    const i=item(id); toast(i.name+' — balance now '+fmtN(availQty(i))+' '+(i.unit||''),'ok','Receipt added'); }
  catch(e){ busy(false); const b=$('#arBtn'); if(b)b.disabled=false; toast(e.message,'bad','Could not save'); } };
window.openReceiptEdit=(iid,rid)=>{ const i=item(iid), r=(i.receipts||[]).find(x=>x.id===rid);
  modal('Edit Receipt — '+i.name, receiptForm(i,r),
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="arBtn" onclick="saveReceiptEdit(\''+iid+'\',\''+rid+'\')">Save changes</button>'); };
window.saveReceiptEdit=async(iid,rid)=>{ const p=readReceipt();
  if(!(p.qty>0)){toast('Enter quantity','bad');return}
  $('#arBtn').disabled=true; busy(true,'Saving…');
  try{ DB=await api('updateReceipt',[rid,p]); busy(false); closeModal(); render();
    const i=item(iid); toast(i.name+' — balance now '+fmtN(availQty(i))+' '+(i.unit||''),'ok','Receipt updated'); }
  catch(e){ busy(false); const b=$('#arBtn'); if(b)b.disabled=false; toast(e.message,'bad','Could not save'); } };

function issueForm(i,r){
  r=r||{}; const today=DB.serverDate||new Date().toISOString().slice(0,10);
  const a=availQty(i)+(r.qty?Number(r.qty):0);
  return '<div style="background:#f2f7ff;border-left:3px solid var(--blue);padding:8px 11px;border-radius:0 6px 6px 0;font-size:12.5px;margin-bottom:12px">Available: <b>'+fmtN(a)+' '+esc(i.unit||'')+'</b>'+(r.qty?' (including this record\'s '+fmtN(r.qty)+')':'')+'</div>'
  +'<div class="grid2">'
  +'<div class="f"><label>Date <span class="req">*</span></label><input id="ai_date" type="date" value="'+esc(r.date||today)+'"></div>'
  +'<div class="f"><label>Quantity ('+esc(i.unit||'')+') <span class="req">*</span></label><input id="ai_qty" type="number" step="any" min="0" max="'+a+'" value="'+esc(r.qty||'')+'"></div>'
  +'<div class="f"><label>Purpose of Use <span class="req">*</span></label><input id="ai_purpose" value="'+esc(r.purpose||'')+'" placeholder="e.g. Replacement of failed CT, Bay 2"></div>'
  +'<div class="f"><label>Issued To</label><input id="ai_to" value="'+esc(r.issuedTo||'')+'"></div>'
  +'<div class="f"><label>Location / Bay</label><input id="ai_loc" value="'+esc(r.location||'')+'"></div>'
  +'<div class="f"><label>Authorised By</label><input id="ai_auth" value="'+esc(r.authorisedBy||'')+'"></div></div>'
  +'<div class="f" style="margin-top:10px"><label>Work / Details</label><textarea id="ai_det" rows="2">'+esc(r.workDetails||'')+'</textarea></div>'
  +'<div class="f" style="margin-top:10px"><label>Remarks</label><textarea id="ai_rem" rows="2">'+esc(r.remarks||'')+'</textarea></div>';
}
function readIssue(){ return {date:$('#ai_date').value,qty:Number($('#ai_qty').value||0),purpose:$('#ai_purpose').value.trim(),
  issuedTo:$('#ai_to').value.trim(),location:$('#ai_loc').value.trim(),authorisedBy:$('#ai_auth').value.trim(),
  workDetails:$('#ai_det').value.trim(),remarks:$('#ai_rem').value.trim()}; }
window.openIssue=id=>modal('Issue / Consume — '+item(id).name, issueForm(item(id),null),
  '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="aiBtn" onclick="saveIssue(\''+id+'\')">Record Issue</button>');
window.saveIssue=async id=>{ const p=readIssue();
  if(!(p.qty>0)){toast('Enter quantity','bad');return}
  if(!p.purpose){toast('Purpose of use is required','bad');return}
  $('#aiBtn').disabled=true; busy(true,'Saving…');
  try{ p.docs=[]; DB=await api('addIssue',[id,p]); busy(false); closeModal(); S.tab='used'; render();
    const i=item(id); toast(i.name+' — balance now '+fmtN(availQty(i))+' '+(i.unit||''),'ok','Issue recorded');
    if(isLow(i)) toast(i.name+' is at/below its cut-off of '+fmtN(i.lowCutoff),'warn','Low stock'); }
  catch(e){ busy(false); const b=$('#aiBtn'); if(b)b.disabled=false; toast(e.message,'bad','Could not save'); } };
window.openIssueEdit=(iid,rid)=>{ const i=item(iid), r=(i.issues||[]).find(x=>x.id===rid);
  modal('Edit Issue — '+i.name, issueForm(i,r),
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="aiBtn" onclick="saveIssueEdit(\''+iid+'\',\''+rid+'\')">Save changes</button>'); };
window.saveIssueEdit=async(iid,rid)=>{ const p=readIssue();
  if(!(p.qty>0)){toast('Enter quantity','bad');return}
  if(!p.purpose){toast('Purpose of use is required','bad');return}
  $('#aiBtn').disabled=true; busy(true,'Saving…');
  try{ DB=await api('updateIssue',[rid,p]); busy(false); closeModal(); render();
    const i=item(iid); toast(i.name+' — balance now '+fmtN(availQty(i))+' '+(i.unit||''),'ok','Issue updated'); }
  catch(e){ busy(false); const b=$('#aiBtn'); if(b)b.disabled=false; toast(e.message,'bad','Could not save'); } };
window.revertIssue=async(iid,rid)=>{ const i=item(iid), r=(i.issues||[]).find(x=>x.id===rid);
  if(!confirm('Revert this issue?\n\n'+fmtN(r.qty)+' '+(i.unit||'')+' will go back into stock and the record will be removed.'))return;
  busy(true,'Reverting…');
  try{ DB=await api('deleteRecord',['issues',rid]); busy(false); render();
    const it=item(iid); toast(fmtN(r.qty)+' '+(it.unit||'')+' returned — balance now '+fmtN(availQty(it)),'ok','Issue reverted'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.delRec=async(kind,rid)=>{
  if(!confirm('Delete this '+(kind==='receipts'?'receipt':'issue')+' permanently?'))return;
  busy(true,'Deleting…');
  try{ DB=await api('deleteRecord',[kind,rid]); busy(false); render(); toast((kind==='receipts'?'Receipt':'Issue')+' deleted','ok'); }
  catch(e){ busy(false); toast(e.message,'bad','Could not delete'); } };
window.delItem=async id=>{ const i=item(id);
  if(!confirm('Delete “'+i.name+'” and ALL its receipts and issues?\n\nThis cannot be undone.'))return;
  busy(true,'Deleting…');
  try{ DB=await api('deleteItem',[id]); busy(false); go('available'); toast(i.name+' removed','ok','Material deleted'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.openEditItem=id=>{ const i=item(id),c=cat(i.categoryId);
  modal('Edit — '+i.name,
    '<div class="grid2"><div class="f"><label>Item Name</label><input id="e_name" value="'+esc(i.name)+'"></div>'
    +'<div class="f"><label>Unit of Measure</label>'+selectWithOther('e_unit',DB.uoms,i.unit||'','Type a new unit')+'</div>'
    +'<div class="f"><label>Store / Location</label><input id="e_loc" value="'+esc(i.location||'')+'"></div></div>'
    +'<fieldset style="margin-top:12px"><legend>'+esc(c.name)+'</legend><div class="grid2">'
    +(c.fields||[]).map(f=>fieldInput(f,i.fields&&i.fields[f.key])).join('')+'</div></fieldset>'
    +'<div class="f"><label>Remarks</label><textarea id="e_rem" rows="2">'+esc(i.remarks||'')+'</textarea></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveItem(\''+id+'\')">Save</button>',true); };
window.saveItem=async id=>{ const i=item(id),c=cat(i.categoryId), fr=readFields(c);
  const unit=readSel('e_unit')||i.unit;
  const promos=fr.promos.slice();
  if(isOtherUsed('e_unit') && DB.uoms.indexOf(unit)<0) promos.push({kind:'uom',label:'Unit of Measure',value:unit});
  busy(true,'Saving…');
  try{ DB=await api('updateItem',[id,{name:$('#e_name').value.trim()||i.name,unit:unit,location:$('#e_loc').value.trim(),
      trackLow:i.trackLow,lowCutoff:i.lowCutoff,fields:fr.values,remarks:$('#e_rem').value.trim()}]);
    busy(false); closeModal(); render(); toast(item(id).name,'ok','Material updated');
    if(promos.length) offerPromotions(promos); }
  catch(e){ busy(false); toast(e.message,'bad'); } };

/* ---------- documents ---------- */
window.openLink=(kind,id)=>{
  const cur=new Set(kind==='item'?(item(id).docs||[]):(kind==='receipt'
      ? (DB.items.flatMap(i=>i.receipts||[]).find(r=>r.id===id)||{}).docs||[]
      : (DB.items.flatMap(i=>i.issues||[]).find(r=>r.id===id)||{}).docs||[]));
  const avail=DB.docs.filter(d=>!cur.has(d.id));
  modal('Link an existing document',
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 10px">Files stay in the one Drive folder — this just points to them.</p>'
    +(avail.length?'<div class="gal">'+avail.map(d=>'<figure><div class="imgwrap"><img src="'+(d.thumb||'')+'" alt=""></div><figcaption>'+esc(d.title)+'</figcaption>'
      +'<div class="drow"><label style="flex:1;display:flex;align-items:center;gap:5px;justify-content:center;cursor:pointer"><input type="checkbox" class="lchk" value="'+d.id+'"> pick</label></div></figure>').join('')+'</div>'
      :'<div class="empty"><p>Every document is already linked here.</p></div>'),
    '<button class="btn" onclick="closeModal()">Cancel</button>'+(avail.length?'<button class="btn primary" onclick="doLink(\''+kind+'\',\''+id+'\')">Link selected</button>':''),true);
};
window.doLink=async(kind,id)=>{
  const picks=[...document.querySelectorAll('.lchk')].filter(c=>c.checked).map(c=>c.value);
  if(!picks.length){toast('Pick at least one document','bad');return}
  busy(true,'Linking…');
  try{ DB=await api('linkDocs',[kind,id,picks]); busy(false); closeModal(); render(); toast(picks.length+' document(s) linked','ok'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.unlinkDoc=async(kind,id,docId)=>{
  if(!confirm('Unlink this document?\n\nThe file stays in the Drive folder.'))return;
  busy(true,'Unlinking…');
  try{ DB=await api('unlinkDoc',[kind,id,docId]); busy(false); render(); toast('Document unlinked (file kept in Drive)','ok'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.delDoc=async id=>{ const d=doc_(id);
  if(!confirm('Delete “'+d.title+'”?\n\nThe file will be moved to Drive trash and unlinked everywhere.'))return;
  busy(true,'Deleting…');
  try{ DB=await api('deleteDoc',[id]); busy(false); render(); toast(d.title,'ok','Document deleted'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.syncFolder=async()=>{ busy(true,'Scanning Drive folder…');
  try{ const b=DB.docs.length; DB=await api('syncFolder',[]); busy(false); render();
    const n=DB.docs.length-b; toast(n?(n+' new file(s) found'):'No new files','ok','Folder synced'); }
  catch(e){ busy(false); toast(e.message,'bad'); } };
window.openUpload=(kind,id)=>{
  modal('Upload Document'+(kind?' & attach':''),
    '<div class="f"><label>Title <span class="req">*</span></label><input id="u_title" placeholder="e.g. Gate Pass 700/1500 dtd. 01.08.2026"></div>'
    +'<div class="f" style="margin-top:10px"><label>Image file <span class="req">*</span></label><input id="u_file" type="file" accept="image/*"></div>'
    +'<div class="hint" style="margin-top:8px">Resized in your browser, then stored once in the Drive folder'+(kind?' and linked to this record':'')+'.</div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="uBtn" onclick="doUpload('+(kind?'\''+kind+'\',\''+id+'\'':'')+')">Upload</button>');
};
function resizeImg(file,max,q){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>{ const im=new Image();
      im.onload=()=>{ const sc=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas'); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',q).split(',')[1]); };
      im.onerror=rej; im.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file); });
}
window.doUpload=async(kind,id)=>{
  const t=$('#u_title').value.trim(), f=$('#u_file').files[0];
  if(!t){toast('Enter a title','bad');return}
  if(!f){toast('Choose an image','bad');return}
  $('#uBtn').disabled=true; busy(true,'Uploading to Drive…');
  try{ const full=await resizeImg(f,1600,.82), thumb=await resizeImg(f,240,.6);
    DB=await api('uploadDoc',[{title:t,name:f.name,mime:'image/jpeg',full:full,thumb:thumb,link:kind?{kind:kind,id:id}:null}]);
    busy(false); closeModal(); render(); toast(t+' stored in Drive'+(kind?' and attached':''),'ok','Upload complete'); }
  catch(e){ busy(false); const b=$('#uBtn'); if(b)b.disabled=false; toast(e.message,'bad','Upload failed'); } };

/* ---------- render / boot ---------- */
function render(){
  const P={dash:pageDash,available:pageAvailable,low:pageLow,issued:pageIssued,register:pageRegister,
           ledger:pageLedger,documents:pageDocuments,admin:pageAdmin,item:pageItem};
  $('#view').innerHTML=(P[S.page]||pageDash)();
  document.querySelectorAll('[data-sec]').forEach(el=>el.classList.remove('no-print'));
  renderNav();
}
function setRole(r){ S.role=r; $('#roleAdmin').classList.toggle('on',r==='admin'); $('#roleEditor').classList.toggle('on',r==='editor'); render(); }
async function boot(){
  busy(true,'Connecting to database…');
  try{ DB=await api('getBootstrap'); busy(false); setRole(S.role); render(); toast(DB.items.length+' materials · '+DB.docs.length+' documents','ok','Connected'); }
  catch(e){ busy(false);
    $('#view').innerHTML='<div class="card"><div class="empty"><h1 style="font-size:18px;color:var(--bad);margin-bottom:8px">Could not reach the database</h1>'
      +'<p class="mono" style="background:#fdeceb;padding:8px 12px;border-radius:6px;display:inline-block">'+esc(e.message)+'</p>'
      +'<ul style="text-align:left;max-width:540px;margin:14px auto;font-size:12.5px">'
      +'<li>Run <b>setupDatabase()</b> once in the Apps Script editor</li>'
      +'<li>Run <b>indexDocuments()</b> to register the Drive images</li>'
      +'<li>Deploy the web app with <b>Who has access: Anyone</b></li>'
      +'<li>After editing Code.gs, create a <b>New deployment</b> (or update the existing one)</li></ul>'
      +'<button class="btn primary" onclick="boot()">Retry</button></div></div>'; renderNav(); }
}
function init(){
  initLb();
  $('#roleAdmin').onclick=()=>setRole('admin'); $('#roleEditor').onclick=()=>setRole('editor');
  $('#btnRefresh').onclick=async()=>{ busy(true,'Refreshing…'); try{ DB=await api('getBootstrap'); busy(false); render(); toast('Data reloaded','ok'); }catch(e){ busy(false); toast(e.message,'bad'); } };
  $('#hamb').onclick=()=>{ $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); };
  $('#scrim').onclick=()=>{ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); };
  $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
  let t; $('#q').addEventListener('input',e=>{ clearTimeout(t); t=setTimeout(()=>{ S.q=e.target.value.trim();
    if(S.q && ['available','issued','ledger'].indexOf(S.page)<0){ S.hist.push(snap()); S.page='available'; } render(); },200); });
  setRole('editor'); boot();
}
init();
</script>
</body>
